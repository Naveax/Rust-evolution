name: rustfmt-export

on:
  pull_request:
    paths:
      - 'crates/**/*.rs'
      - '.github/workflows/rustfmt-export.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatted sources when needed
        shell: bash
        run: |
          if git diff --quiet -- crates; then
            echo "rustfmt already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates
          git commit -m "style: apply rustfmt to functions v0"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
