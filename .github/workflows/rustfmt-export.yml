name: rustfmt-export

on:
  pull_request:
    paths:
      - 'crates/**/*.rs'
      - '.github/workflows/rustfmt-export.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: functions-v0-rustfmt
          path: |
            crates/evo-lexer/src/lib.rs
            crates/evo-parser/src/lib.rs
            crates/evo-lowering/src/lib.rs
            crates/evo-codegen-rust/src/lib.rs
            crates/evo-formatter/src/lib.rs
          if-no-files-found: error
