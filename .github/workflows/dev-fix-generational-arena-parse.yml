name: Dev fix generational arena parse probe

on:
  push:
    branches:
      - research/generational-arena-surface-v0
    paths:
      - '.github/workflows/dev-fix-generational-arena-parse.yml'

permissions:
  contents: write

concurrency:
  group: dev-fix-generational-arena-parse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/generational-arena-surface-v0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Patch parser probe and research-only clippy boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/evo-lowering/tests/generational_arena_surface_research.rs')
          text = path.read_text()

          old_parse = '        parse(ordinary_identifier_program).is_ok(),\n'
          new_parse = '        lex(ordinary_identifier_program).is_ok_and(|tokens| parse(&tokens).is_ok()),\n'
          if text.count(old_parse) != 1:
              raise SystemExit(f'expected exactly one parse probe, found {text.count(old_parse)}')
          text = text.replace(old_parse, new_parse)

          old_reports = 'fn write_reports(\n'
          new_reports = '#[allow(clippy::too_many_arguments)]\nfn write_reports(\n'
          if text.count(old_reports) != 1:
              raise SystemExit(f'expected exactly one write_reports helper, found {text.count(old_reports)}')
          text = text.replace(old_reports, new_reports)

          path.write_text(text)
          PY
          cargo fmt --all

      - name: Targeted validation
        run: |
          cargo clippy -p evo-lowering --test generational_arena_surface_research -- -D warnings
          EVO_REQUIRE_PINNED_RUSTC=1 EVO_GIT_SHA=${GITHUB_SHA} EVO_GENERATIONAL_ARENA_SURFACE_RESEARCH_OUT=${RUNNER_TEMP}/arena-research cargo test -p evo-lowering --test generational_arena_surface_research generational_arena_surface_research_resolves_reuse_identity_and_borrow_boundaries -- --ignored --exact --nocapture

      - name: Remove one-shot workflow
        run: rm .github/workflows/dev-fix-generational-arena-parse.yml

      - name: Commit validated fix
        run: |
          git config user.name "Naveax"
          git config user.email "Omersevik095@gmail.com"
          git add crates/evo-lowering/tests/generational_arena_surface_research.rs .github/workflows/dev-fix-generational-arena-parse.yml
          git diff --cached --check
          git commit -m "fix: validate arena research matrix"
          git push origin HEAD:research/generational-arena-surface-v0
