name: Bootstrap explicit shared handle rustfmt

on:
  push:
    branches:
      - research/explicit-shared-handle-surface-v0
    paths:
      - '.github/workflows/explicit-shared-handle-format-bootstrap.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/explicit-shared-handle-surface-v0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/evo-formatter/tests/explicit_shared_handle_surface_research.rs
          git commit -m 'style: format explicit shared handle research harness'
          git push origin HEAD:research/explicit-shared-handle-surface-v0
