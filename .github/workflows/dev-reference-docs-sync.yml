name: DEV immutable reference docs sync

on:
  push:
    branches:
      - feature/immutable-reference-surface-v0
    paths:
      - .github/workflows/dev-reference-docs-sync.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/immutable-reference-surface-v0
          fetch-depth: 0

      - name: Synchronize implemented reference documentation
        run: python .github/scripts/sync_reference_docs.py

      - name: Validate documentation patch
        run: |
          git diff --check
          grep -q '### Immutable references v0' docs/LANGUAGE_SPEC_V0.md
          grep -q 'Active production — #104 / PR #105' docs/NEXT_ACTION.md
          grep -q 'Active production — #104 / PR #105' docs/PROJECT_STATE.md

      - name: Commit synchronized docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LANGUAGE_SPEC_V0.md docs/NEXT_ACTION.md docs/PROJECT_STATE.md
          git diff --cached --check
          git commit -m "docs: synchronize immutable references v0"
          git push origin HEAD:feature/immutable-reference-surface-v0
