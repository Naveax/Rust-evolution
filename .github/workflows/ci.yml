name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: ${{ matrix.os }} / Rust 1.98.0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Show toolchain
        run: rustc -Vv

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Benchmark harness smoke
        run: cargo run -p evo-bench -- run benchmarks/cases/arithmetic-smoke --out target/evo-bench-smoke --report-only

      - name: Upload benchmark smoke report
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-smoke-${{ matrix.os }}
          path: target/evo-bench-smoke/
          if-no-files-found: error

      - name: Runtime repeat performance gate
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p evo-bench -- run benchmarks/cases/runtime-repeat-v0 --out target/evo-bench-runtime-repeat

      - name: Upload runtime repeat report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-runtime-repeat-ubuntu-latest
          path: target/evo-bench-runtime-repeat/
          if-no-files-found: error

      - name: Release build
        run: cargo build --workspace --release
