name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Rust 1.98.0
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify CI checkout provenance
        shell: bash
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_GIT_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Show toolchain
        run: rustc -Vv

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Fast edit-run turnaround evidence
        id: fast_edit_run_turnaround
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_TURNAROUND_OUT: ${{ github.workspace }}/target/evo-fast-edit-run-turnaround
        run: cargo test -p evo-cli --test fast_edit_run_turnaround fast_edit_run_turnaround_reports_verified_warm_speedup -- --ignored --exact --nocapture

      - name: Upload fast edit-run turnaround evidence
        if: matrix.os == 'ubuntu-24.04' && always() && steps.fast_edit_run_turnaround.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: evo-fast-edit-run-turnaround-ubuntu-24.04
          path: target/evo-fast-edit-run-turnaround/
          if-no-files-found: error

      - name: Build latency baseline evidence
        id: build_latency_baseline
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_BUILD_LATENCY_OUT: ${{ github.workspace }}/target/evo-build-latency
        run: cargo test -p evo-cli --test build_latency_baseline build_latency_baseline_reports_cold_warm_edit_and_rustc_attribution -- --ignored --exact --nocapture

      - name: Upload build latency baseline evidence
        if: matrix.os == 'ubuntu-24.04' && always() && steps.build_latency_baseline.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: evo-build-latency-ubuntu-24.04
          path: target/evo-build-latency/
          if-no-files-found: error

      - name: Incremental build research evidence
        id: incremental_build_research
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_INCREMENTAL_RESEARCH_OUT: ${{ github.workspace }}/target/evo-incremental-build-research
        run: |
          cargo test -p evo-cli --test incremental_build_research incremental_build_research_isolates_stable_path_and_persistent_rustc_state -- --ignored --exact --nocapture
          cargo test -p evo-cli --test incremental_codegen_units_research incremental_codegen_unit_granularity_compares_matching_256_cgu_control -- --ignored --exact --nocapture
          cargo test -p evo-cli --test incremental_runtime_quality_research incremental_candidate_runtime_quality_is_measured_against_current_and_reference -- --ignored --exact --nocapture
          cargo test -p evo-cli --test incremental_runtime_identity_research incremental_runtime_identity_isolates_flag_from_edit_reuse -- --ignored --exact --nocapture
          cargo test -p evo-cli --test incremental_runtime_corpus_research incremental_runtime_candidate_is_measured_across_committed_corpus -- --ignored --exact --nocapture

      - name: Upload incremental build research evidence
        if: matrix.os == 'ubuntu-24.04' && always() && steps.incremental_build_research.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: evo-incremental-build-research-ubuntu-24.04
          path: target/evo-incremental-build-research/
          if-no-files-found: error

      - name: Verified build cache turnaround evidence
        id: build_cache_turnaround
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_BUILD_CACHE_OUT: ${{ github.workspace }}/target/evo-build-cache-turnaround
        run: cargo test -p evo-cli --test build_cache_turnaround verified_build_cache_reports_zero_warm_compiles_and_speedup -- --ignored --exact --nocapture

      - name: Upload verified build cache turnaround evidence
        if: matrix.os == 'ubuntu-24.04' && always() && steps.build_cache_turnaround.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: evo-build-cache-turnaround-ubuntu-24.04
          path: target/evo-build-cache-turnaround/
          if-no-files-found: error

      - name: Benchmark harness smoke
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/arithmetic-smoke --out target/evo-bench-smoke --report-only

      - name: Upload benchmark smoke report
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-smoke-${{ matrix.os }}
          path: target/evo-bench-smoke/
          if-no-files-found: error

      - name: Runtime repeat performance gate
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/runtime-repeat-v0 --out target/evo-bench-runtime-repeat

      - name: Upload runtime repeat report
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-runtime-repeat-ubuntu-24.04
          path: target/evo-bench-runtime-repeat/
          if-no-files-found: error

      - name: Control-flow branch performance gate
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/control-flow-branch-v0 --out target/evo-bench-control-flow

      - name: Upload control-flow branch report
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-control-flow-ubuntu-24.04
          path: target/evo-bench-control-flow/
          if-no-files-found: error

      - name: Logical operators performance gate
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/logical-operators-v0 --out target/evo-bench-logical-operators

      - name: Upload logical operators report
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-logical-operators-ubuntu-24.04
          path: target/evo-bench-logical-operators/
          if-no-files-found: error

      - name: Functions v0 performance gate
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/function-call-v0 --out target/evo-bench-functions

      - name: Upload functions v0 report
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-functions-ubuntu-24.04
          path: target/evo-bench-functions/
          if-no-files-found: error

      - name: Block locals v0 performance gate
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/block-locals-v0 --out target/evo-bench-block-locals

      - name: Upload block locals v0 report
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-block-locals-ubuntu-24.04
          path: target/evo-bench-block-locals/
          if-no-files-found: error

      - name: Records v0 performance gate
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/records-v0 --out target/evo-bench-records

      - name: Upload Records v0 report
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-records-ubuntu-24.04
          path: target/evo-bench-records/
          if-no-files-found: error

      - name: Inferred shared-borrow v0 performance gate
        id: inferred_shared_borrow_v0
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/inferred-shared-borrow-v0 --out target/evo-bench-inferred-shared-borrow

      - name: Upload inferred shared-borrow v0 report
        if: matrix.os == 'ubuntu-24.04' && always() && steps.inferred_shared_borrow_v0.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-inferred-shared-borrow-ubuntu-24.04
          path: target/evo-bench-inferred-shared-borrow/
          if-no-files-found: error

      - name: Enums v0 performance gate
        id: enums_v0
        if: matrix.os == 'ubuntu-24.04'
        env:
          EVO_GIT_SHA: ${{ github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/enums-v0 --out target/evo-bench-enums

      - name: Upload Enums v0 report
        if: matrix.os == 'ubuntu-24.04' && always() && steps.enums_v0.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-enums-ubuntu-24.04
          path: target/evo-bench-enums/
          if-no-files-found: error

      - name: Validate evo-bench provenance reports
        if: matrix.os == 'ubuntu-24.04'
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = [
              Path('target/evo-bench-smoke/report.json'),
              Path('target/evo-bench-runtime-repeat/report.json'),
              Path('target/evo-bench-control-flow/report.json'),
              Path('target/evo-bench-logical-operators/report.json'),
              Path('target/evo-bench-functions/report.json'),
              Path('target/evo-bench-block-locals/report.json'),
              Path('target/evo-bench-records/report.json'),
              Path('target/evo-bench-inferred-shared-borrow/report.json'),
              Path('target/evo-bench-enums/report.json'),
          ]
          expected_flags = [
              '--crate-name',
              'evo_benchmark_case',
              '--edition=2024',
              '-C',
              'opt-level=3',
              '-C',
              'codegen-units=1',
              '-C',
              'lto=thin',
              '-C',
              'debuginfo=0',
          ]
          for path in reports:
              report = json.loads(path.read_text())
              assert report['schema_version'] == 3, (path, report)
              assert report['git_sha'] == os.environ['EXPECTED_GIT_SHA'], (path, report)
              assert report['build_flags'] == expected_flags, (path, report)
              assert report['host_os'], (path, report)
              assert report['host_arch'], (path, report)
              assert report['ci_provider'] == 'github-actions', (path, report)
              assert report['runner_name'], (path, report)
              assert report['runner_os'], (path, report)
              assert report['runner_arch'], (path, report)
              assert report['target'], (path, report)
              assert report['rustc_verbose'], (path, report)
          print(f'validated {len(reports)} evo-bench provenance reports')
          PY

      - name: Release build
        run: cargo build --workspace --release
