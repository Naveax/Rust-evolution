name: DEV immutable reference provenance bootstrap v3

on:
  push:
    branches:
      - feature/immutable-reference-surface-v0
    paths:
      - .github/workflows/dev-reference-provenance-bootstrap-v3.yml

permissions:
  contents: write

concurrency:
  group: dev-reference-provenance-bootstrap-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/immutable-reference-surface-v0
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Reuse v2 patch without replacement escape rewriting
        shell: python
        run: |
          from pathlib import Path

          workflow = Path(".github/workflows/dev-reference-provenance-bootstrap-v2.yml").read_text().splitlines()
          marker = workflow.index("      - name: Reuse provenance patch with bounded call-site fix")
          run_line = next(i for i in range(marker + 1, len(workflow)) if workflow[i] == "        run: |")
          end = next(i for i in range(run_line + 1, len(workflow)) if workflow[i] == "      - name: Format")
          prefix = "          "
          code = "\n".join(
              line[len(prefix):] if line.startswith(prefix) else line
              for line in workflow[run_line + 1:end]
          )
          needle = "    replacement,\n    code,"
          if code.count(needle) != 1:
              raise SystemExit("expected one re.sub replacement argument")
          code = code.replace(needle, "    lambda _: replacement,\n    code,", 1)
          exec(compile(code, "dev-reference-provenance-bootstrap-v3", "exec"), {})

      - name: Format
        run: cargo +1.98.0 fmt --all

      - name: Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo +1.98.0 test --workspace

      - name: Verify diff
        run: git diff --check

      - name: Commit verified provenance core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/evo-lowering/src/reference_state.rs crates/evo-lowering/src/lib.rs crates/evo-codegen-rust/src/lib.rs
          git diff --cached --check
          git commit -m "feat: track immutable reference provenance"
          git push origin HEAD:feature/immutable-reference-surface-v0
