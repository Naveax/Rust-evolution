name: Stage final explicit shared owner spec

on:
  push:
    branches:
      - staging/explicit-shared-handle-spec-final
    paths:
      - '.github/workflows/stage-explicit-shared-owner-final-spec.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout spec branch
        uses: actions/checkout@v5
        with:
          ref: staging/explicit-shared-handle-spec-final

      - name: Apply bounded production wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/LANGUAGE_SPEC_V0.md')
          t = p.read_text()

          old = '''unary               := "-" unary | "&" unary | contextual_shared_prefix | postfix
          contextual_shared_prefix
                              := "share" unary | "dup" unary
          postfix             := primary ("." IDENTIFIER)*
          '''
          new = '''unary               := "-" unary | "&" unary | contextual_shared_prefix | postfix
          contextual_shared_prefix
                              := ("share" | "dup") identifier_led_unary
          identifier_led_unary
                              := unary   # accepted only when the operand begins with IDENTIFIER
          postfix             := primary ("." IDENTIFIER)*
          '''
          if old not in t:
              raise SystemExit('grammar marker missing')
          t = t.replace(old, new, 1)

          marker = 'The three source words stay contextual rather than becoming lexer keywords:\n\n'
          insert = marker + 'The contextual prefix recognizer is intentionally narrower than a general unary operator: after `share` or `dup`, the operand must begin with an identifier token. This covers locals and identifier-led calls/constructors while grouped, literal, or operator-leading operands are not captured as shared-owner prefixes.\n\n'
          if marker not in t:
              raise SystemExit('contextual marker missing')
          t = t.replace(marker, insert, 1)

          marker2 = 'Shared-owner record fields and enum payloads, nested/general `shared` type algebra, `Weak`, cycle solving, cross-thread ownership, interior mutability, synchronization, mutable references, and generalized lifetime/generic machinery remain outside this slice.\n'
          insert2 = marker2 + '\nShared-owner v0 is currently a record-only executable path. A program containing enum declarations uses the Enums v0 integrated semantic pipeline, which rejects explicit shared-owner/reference contracts and expressions before executable IR/codegen. Shared ownership therefore does not yet compose with enum-bearing programs; this is an explicit fail-closed boundary rather than an implicit conversion or runtime fallback.\n'
          if marker2 not in t:
              raise SystemExit('enum boundary marker missing')
          t = t.replace(marker2, insert2, 1)

          old_records = 'Records use ordinary by-value move semantics by default. Reading a record local by value consumes it. Passing or returning a record by value uses the same rule. The bounded inferred shared-borrow parameter rule described under Functions v0 is the only implemented exception to by-value nominal parameter passing.\n\nA moved record local may be explicitly reinitialized by assigning a new value of the exact same nominal type.\n\nThere is no implicit `.clone()`, copy insertion, user-facing reference syntax, or general reference inference.\n'
          new_records = 'Records use ordinary by-value move semantics by default. Reading a record local by value consumes it. Passing or returning a record by value uses the same rule. Qualifying ordinary nominal function parameters may use the bounded inferred `SharedBorrow` mode; explicit `&T` references and explicit `shared T` owners are separate source-level value categories and do not silently change an owned record into another category.\n\nA moved record local may be explicitly reinitialized by assigning a new value of the exact same nominal type.\n\nThere is no implicit `.clone()`, copy insertion, owner duplication, or generalized reference inference. Explicit immutable references use the bounded `&T` / `&expr` rules above, and explicit shared ownership requires `share` / `dup`.\n'
          if old_records not in t:
              raise SystemExit('record ownership wording missing')
          t = t.replace(old_records, new_records, 1)

          final_marker = '## Current explicit non-features\n'
          perf = '''### Accepted explicit shared-owner v0 parity evidence\n\nExact performance component head `c83d42dbe0e346021f1f524cf9d65f67fdbc66d3`, Explicit shared owner performance #7 / run `34824865453`, produced:\n\n- committed benchmark-reference/generated-Rust exact lock: PASS;\n- differential stdout/stderr/exit correctness: PASS;\n- normalized LLVM IR equality: true;\n- exact executable equality: true;\n- reference binary size: 2,267,304 bytes;\n- Evolution binary size: 2,267,304 bytes;\n- reference median: 828,921 ns;\n- Evolution median: 823,093 ns;\n- stable measurement: true;\n- observed median ratio: `0.992969173`;\n- timing verdict: PASS;\n- final verdict: PASS;\n- verdict basis: `byte-identical-binary-parity`.\n\nArtifact `evo-bench-explicit-shared-owner-ubuntu-24.04`, id `10339932088`, digest `sha256:a490d5a0bc5d2cfe15c4da01b89cb45eb9e4d8aa51d8309d865a926dc60d6721`, retains the report and generated/reference evidence. Final integration still requires the permanent gate to pass on the combined feature head.\n\n'''
          if final_marker not in t:
              raise SystemExit('non-feature marker missing')
          t = t.replace(final_marker, perf + final_marker, 1)
          p.write_text(t)
          PY

      - name: Validate final spec shape
        run: |
          grep -q 'identifier_led_unary' docs/LANGUAGE_SPEC_V0.md
          grep -q 'does not yet compose with enum-bearing programs' docs/LANGUAGE_SPEC_V0.md
          grep -q 'Accepted explicit shared-owner v0 parity evidence' docs/LANGUAGE_SPEC_V0.md
          grep -q '34824865453' docs/LANGUAGE_SPEC_V0.md
          ! grep -q 'user-facing reference syntax' docs/LANGUAGE_SPEC_V0.md

      - name: Commit spec and remove bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LANGUAGE_SPEC_V0.md
          git rm .github/workflows/stage-explicit-shared-owner-final-spec.yml
          git commit -m 'docs: finalize explicit shared owner v0 specification'
          git push origin HEAD:staging/explicit-shared-handle-spec-final
