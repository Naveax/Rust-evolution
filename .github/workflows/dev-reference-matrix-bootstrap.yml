name: DEV immutable reference matrix bootstrap

on:
  push:
    branches:
      - feature/immutable-reference-surface-v0
    paths:
      - .github/workflows/dev-reference-matrix-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/immutable-reference-surface-v0
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Add permanent reference matrix coverage
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/evo-lowering/src/lib.rs")
          text = path.read_text()
          anchor = "    #[test]\n    fn rejects_unknown_record_signature_types() {\n"
          tests = '''    #[test]
              fn same_owner_branches_preserve_reference_source() {
                  lower_source(
                      "record Item\\nvalue int\\nend\\nfn choose_same(item &Item, flag bool) &Item\\nif flag\\nreturn item\\nelse\\nreturn &item\\nend\\nend\\n",
                  )
                  .expect("both branches derive the returned reference from the same source");
              }

              #[test]
              fn recursive_reference_forwarding_preserves_source() {
                  lower_source(
                      "record Item\\nvalue int\\nend\\nfn recurse(item &Item, n int) &Item\\nif n <= 0\\nreturn item\\nelse\\nreturn recurse(item, n - 1)\\nend\\nend\\n",
                  )
                  .expect("recursive forwarding through the sole reference source should lower");
              }

              #[test]
              fn rejects_nominal_field_move_through_immutable_reference() {
                  let error = lower_source(
                      "record Inner\\nvalue int\\nend\\nrecord Outer\\ninner Inner\\nend\\nfn bad(item &Outer) Inner\\nreturn item.inner\\nend\\n",
                  )
                  .expect_err("moving a nominal field through an immutable reference must fail");
                  assert!(error.message.contains("record-valued field"));
                  assert!(error.message.contains("no implicit clone"));
              }

          '''
          if text.count(anchor) != 1:
              raise SystemExit("reference matrix anchor missing or duplicated")
          path.write_text(text.replace(anchor, tests + anchor, 1))

      - name: Format
        run: cargo +1.98.0 fmt --all

      - name: Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo +1.98.0 test --workspace

      - name: Commit verified matrix tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/evo-lowering/src/lib.rs
          git diff --cached --check
          git commit -m "test: lock immutable reference semantic matrix"
          git push origin HEAD:feature/immutable-reference-surface-v0
