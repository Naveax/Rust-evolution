name: Bootstrap explicit shared handle semantics

on:
  push:
    branches:
      - feature/explicit-shared-handle-v0
    paths:
      - '.github/workflows/explicit-shared-handle-semantics-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/explicit-shared-handle-v0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply semantic patch
        run: |
          python3 .github/scripts/bootstrap_explicit_shared_semantics.py
          python3 .github/scripts/bootstrap_explicit_shared_semantics_fix.py

      - name: Format and validate semantic slice
        run: |
          cargo fmt --all
          cargo check -p evo-lowering --all-targets
          cargo clippy -p evo-lowering --all-targets -- -D warnings
          cargo test -p evo-lowering --test shared_owner_v0

      - name: Commit semantic slice and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/explicit-shared-handle-semantics-bootstrap.yml
          rm .github/scripts/bootstrap_explicit_shared_semantics.py
          rm .github/scripts/bootstrap_explicit_shared_semantics_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/evo-lowering .github/workflows/explicit-shared-handle-semantics-bootstrap.yml .github/scripts/bootstrap_explicit_shared_semantics.py .github/scripts/bootstrap_explicit_shared_semantics_fix.py
          git commit -m 'feat: add explicit shared owner semantics'
          git push origin HEAD:feature/explicit-shared-handle-v0
