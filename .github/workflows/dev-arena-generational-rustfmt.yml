name: Dev arena generational research rustfmt

on:
  push:
    paths:
      - '.github/workflows/dev-arena-generational-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: macos-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: research/arena-generational-handles-v0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatted research source
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/evo-lowering/tests/arena_generational_handles_research.rs
          git commit -m "style: rustfmt arena generational research"
          git push origin HEAD:research/arena-generational-handles-v0
