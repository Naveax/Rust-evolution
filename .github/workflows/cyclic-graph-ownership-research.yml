name: Cyclic graph ownership research

on:
  pull_request:
    paths:
      - 'crates/evo-lowering/tests/cyclic_graph_ownership_research.rs'
      - 'research/cyclic-graph-ownership-v0/**'
      - '.github/workflows/cyclic-graph-ownership-research.yml'
  push:
    branches:
      - main
    paths:
      - 'crates/evo-lowering/tests/cyclic_graph_ownership_research.rs'
      - 'research/cyclic-graph-ownership-v0/**'
      - '.github/workflows/cyclic-graph-ownership-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: ubuntu-24.04 / Rust 1.98.0
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Show toolchain
        run: rustc -Vv

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Run cyclic graph ownership matrix
        env:
          EVO_REQUIRE_PINNED_RUSTC: '1'
          EVO_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVO_CYCLIC_GRAPH_OWNERSHIP_RESEARCH_OUT: ${{ github.workspace }}/target/evo-cyclic-graph-ownership-research
        run: >-
          cargo test -p evo-lowering --test cyclic_graph_ownership_research
          cyclic_graph_ownership_research_classifies_models
          -- --ignored --exact --nocapture

      - name: Validate research report
        env:
          EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path('target/evo-cyclic-graph-ownership-research/report.json')
          data = json.loads(report.read_text())
          assert data['git_sha'] == os.environ['EXPECTED_GIT_SHA'], data
          assert data['verdict'] == 'SPLIT-CANDIDATES', data
          assert data['case_count'] == 15, data
          assert data['compile_expectation_mismatches'] == 0, data
          assert data['runtime_expectation_mismatches'] == 0, data
          assert data['weak_edge_candidate_count'] == 3, data
          assert data['arena_index_candidate_count'] == 3, data
          assert data['borrow_instead_count'] == 1, data
          assert data['rejected_strong_cycle_count'] == 1, data
          assert data['interior_mutability_boundary_count'] == 1, data
          assert data['concurrency_boundary_count'] == 1, data
          assert data['self_referential_boundary_count'] == 1, data
          print(json.dumps(data, indent=2))
          PY

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evo-cyclic-graph-ownership-research-ubuntu-24.04
          path: target/evo-cyclic-graph-ownership-research
          if-no-files-found: warn
          retention-days: 90
