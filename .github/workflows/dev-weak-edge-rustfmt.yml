name: Dev weak edge research rustfmt

on:
  push:
    paths:
      - '.github/workflows/dev-weak-edge-rustfmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: macos-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: research/weak-edge-surface-v0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatted research source
        run: |
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/evo-formatter/tests/weak_edge_surface_research.rs
          git commit -m "style: rustfmt Weak edge research"
          git push origin HEAD:research/weak-edge-surface-v0
