name: block-locals-fix-unused

on:
  pull_request:
    paths:
      - '.github/workflows/block-locals-fix-unused.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Remove unused pattern binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/evo-lowering/src/lib.rs')
          text = path.read_text()
          old = 'StmtKind::Let { name, mutable, .. } => {'
          new = 'StmtKind::Let { mutable, .. } => {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/evo-lowering/src/lib.rs
          git commit -m "fix: remove unused block-local pattern binding"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
