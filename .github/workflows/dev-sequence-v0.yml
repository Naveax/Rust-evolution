name: Dev sequence syntax v0

on:
  push:
    branches:
      - feature/append-only-sequence-v0

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/append-only-sequence-v0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Apply contextual sequence syntax slice
        run: python .github/dev/sequence_syntax_v0_patch.py

      - name: Preserve contextual as spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("crates/evo-formatter/src/lib.rs")
          text = path.read_text()
          needle = 'if matches!(current, TokenKind::Identifier(_)) && matches!(previous, TokenKind::RParen) {'
          if text.count(needle) != 1:
              raise SystemExit("contextual as-spacing anchor changed")
          replacement = 'if matches!(current, TokenKind::Identifier(name) if name == "as") {\n        return true;\n    }\n\n    ' + needle
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Keep downstream matches fail-closed and exhaustive
        run: python .github/dev/sequence_syntax_compat.py

      - name: Normalize enum ownership fail-closed arms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pattern = re.compile(
              r'(?P<indent>^[ \t]*)return Err\(LowerError \{\n'
              r'(?P<body>[ \t]*message: "append-only sequences are not supported in enum-bearing programs in v0"\.to_owned\(\),\n'
              r'[ \t]*span: statement\.span,\n)'
              r'[ \t]*\}\);',
              re.MULTILINE,
          )
          for filename in (
              "crates/evo-lowering/src/enum_borrow_ownership.rs",
              "crates/evo-lowering/src/enum_ownership.rs",
          ):
              path = Path(filename)
              text = path.read_text()
              match = pattern.search(text)
              if match is None or pattern.search(text, match.end()) is not None:
                  raise SystemExit(f"sequence fail-closed return pattern changed in {filename}")
              indent = match.group("indent")
              body = match.group("body")
              replacement = f"{indent}Err(LowerError {{\n{body}{indent}}})"
              path.write_text(pattern.sub(replacement, text, count=1))
          PY

      - name: Keep research helper exhaustive
        run: python .github/dev/sequence_syntax_test_compat.py

      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all --check

      - name: Focused syntax tests
        run: |
          cargo test -p evo-parser --test sequence_syntax_v0
          cargo test -p evo-formatter --test sequence_syntax_v0

      - name: Workspace regression tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Remove one-shot mutation files
        run: rm .github/workflows/dev-sequence-v0.yml .github/dev/sequence_syntax_v0_patch.py .github/dev/sequence_syntax_compat.py .github/dev/sequence_syntax_test_compat.py

      - name: Commit validated syntax slice
        run: |
          git config user.name "Rust Evolution Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add contextual sequence syntax v0"
          git push origin HEAD:feature/append-only-sequence-v0
