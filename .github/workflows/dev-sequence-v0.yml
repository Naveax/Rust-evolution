          Path("crates/evo-parser/tests/sequence_v0.rs").write_text(r'''use evo_lexer::lex;
          use evo_parser::{ExprKind, StmtKind, TypeName, parse};

          fn parse_source(source: &str) -> evo_parser::Program {
              parse(&lex(source).expect("lexing should succeed")).expect("parsing should succeed")
          }

          #[test]
          fn parses_contextual_sequence_type_constructor_append_and_lookup() {
              let program = parse_source(
                  "record Item\nvalue int\nend\nfn keep(items seq Item) seq Item\nreturn items\nend\nitems = seq Item()\nappend items, Item(value = 7)\nlookup items, 0 as item\nprint item.value\nelse\nprint 0\nend\n",
              );
              assert_eq!(
                  program.functions[0].parameters[0].type_name,
                  TypeName::Sequence(Box::new(TypeName::Named("Item".to_owned())))
              );
              assert_eq!(
                  program.functions[0].return_type,
                  TypeName::Sequence(Box::new(TypeName::Named("Item".to_owned())))
              );
              let StmtKind::Bind { expr, .. } = &program.statements[0].kind else {
                  panic!("expected sequence binding");
              };
              assert!(matches!(expr.kind, ExprKind::SequenceNew { .. }));
              assert!(matches!(program.statements[1].kind, StmtKind::SequenceAppend { .. }));
              let StmtKind::SequenceLookup { binding, then_body, else_body, .. } = &program.statements[2].kind else {
                  panic!("expected checked lookup");
              };
              assert_eq!(binding, "item");
              assert_eq!(then_body.len(), 1);
              assert_eq!(else_body.len(), 1);
          }

          #[test]
          fn contextual_words_remain_ordinary_identifiers_outside_sequence_positions() {
              let program = parse_source(
                  "fn seq(value int) int\nreturn value\nend\nseq = 1\nappend = seq(seq)\nlookup = append\nas = lookup\nprint as\n",
              );
              assert_eq!(program.statements.len(), 5);
          }

          #[test]
          fn rejects_lookup_without_explicit_failure_branch() {
              let error = parse(&lex("items = seq int()\nlookup items, 0 as value\nprint value\nend\n").unwrap())
                  .expect_err("lookup must expose failure");
              assert!(error.message.contains("explicit 'else'"));
          }

          #[test]
          fn rejects_nested_sequence_element_type() {
              let error = parse(&lex("items = seq seq int()\n").unwrap())
                  .expect_err("nested sequence type is outside v0");
              assert!(error.message.contains("nested sequence"));
          }
          ''')

          Path("crates/evo-lowering/tests/sequence_v0.rs").write_text(r'''use evo_lexer::lex;
          use evo_lowering::{StmtKind, ValueType, lower};
          use evo_parser::parse;

          fn lower_source(source: &str) -> Result<evo_lowering::Program, evo_lowering::LowerError> {
              let syntax = parse(&lex(source).expect("lexing should succeed")).expect("parsing should succeed");
              lower(&syntax)
          }

          #[test]
          fn sequence_is_move_only_and_function_contract_stays_owned() {
              let program = lower_source(
                  "record Item\nvalue int\nend\nfn keep(items seq Item) seq Item\nreturn items\nend\n",
              ).expect("sequence signature should lower");
              assert_eq!(
                  program.functions[0].parameters[0].value_type,
                  ValueType::Sequence(Box::new(ValueType::Record("Item".to_owned())))
              );
              assert_eq!(program.functions[0].parameters[0].passing_mode, evo_lowering::ParameterPassingMode::Owned);
          }

          #[test]
          fn append_moves_payload_without_hidden_clone() {
              let program = lower_source(
                  "record Item\nvalue int\nend\nitems = seq Item()\nitem = Item(value = 7)\nappend items, item\n",
              ).expect("append should move payload");
              assert!(matches!(program.statements[2].kind, StmtKind::SequenceAppend { .. }));
              let error = lower_source(
                  "record Item\nvalue int\nend\nitems = seq Item()\nitem = Item(value = 7)\nappend items, item\nprint item.value\n",
              ).expect_err("moved payload reuse must fail");
              assert!(error.message.contains("moved record local"));
          }

          #[test]
          fn checked_lookup_rejects_growth_while_record_element_reference_is_live() {
              let error = lower_source(
                  "record Item\nvalue int\nend\nitems = seq Item()\nappend items, Item(value = 1)\nlookup items, 0 as item\nappend items, Item(value = 2)\nprint item.value\nelse\nprint 0\nend\n",
              ).expect_err("live element reference must block growth");
              assert!(error.message.contains("cannot grow sequence local"));
          }

          #[test]
          fn checked_lookup_allows_growth_after_final_record_element_use() {
              lower_source(
                  "record Item\nvalue int\nend\nitems = seq Item()\nappend items, Item(value = 1)\nlookup items, 0 as item\nprint item.value\nappend items, Item(value = 2)\nelse\nprint 0\nend\n",
              ).expect("final-use release should permit later growth");
          }

          #[test]
          fn checked_lookup_copies_scalar_but_borrows_shared_owner_without_duplication() {
              lower_source(
                  "numbers = seq int()\nappend numbers, 7\nlookup numbers, 0 as n\nprint n + 1\nelse\nprint 0\nend\n",
              ).expect("scalar lookup should bind copy-like value");
              lower_source(
                  "record Item\nvalue int\nend\nowners = seq shared Item()\nowner = share Item(value = 1)\nappend owners, owner\nlookup owners, 0 as borrowed\nprint borrowed.value\nelse\nprint 0\nend\n",
              ).expect("shared owner lookup should borrow handle");
          }

          #[test]
          fn lookup_requires_integer_index_and_append_requires_exact_element_type() {
              let index = lower_source("items = seq int()\nlookup items, true as value\nprint value\nelse\nprint 0\nend\n")
                  .expect_err("non-integer index must fail");
              assert!(index.message.contains("index must be an integer"));
              let value = lower_source("items = seq int()\nappend items, true\n")
                  .expect_err("append type mismatch must fail");
              assert!(value.message.contains("append expects int, found bool"));
          }
          ''')

          Path("crates/evo-codegen-rust/tests/sequence_v0.rs").write_text(r'''use evo_codegen_rust::generate_lowered_rust;
          use evo_lexer::lex;
          use evo_lowering::lower;
          use evo_parser::parse;

          fn compile_source(source: &str) -> String {
              let syntax = parse(&lex(source).expect("lexing should succeed")).expect("parsing should succeed");
              let program = lower(&syntax).expect("lowering should succeed");
              generate_lowered_rust(&program)
          }

          #[test]
          fn lowers_sequence_surface_directly_to_safe_vec_operations() {
              let generated = compile_source(
                  "record Item\nvalue int\nend\nitems = seq Item()\nappend items, Item(value = 7)\nlookup items, 0 as item\nprint item.value\nelse\nprint 0\nend\n",
              );
              assert!(generated.contains("Vec::<__EvoRecord_Item>::new()"));
              assert!(generated.contains("__evo_items.push(__EvoRecord_Item"));
              assert!(generated.contains("usize::try_from"));
              assert!(generated.contains(".get(__evo_internal_index)"));
              assert!(!generated.contains("unsafe"));
              assert!(!generated.contains("Rc::clone"));
              assert!(!generated.contains("RefCell"));
          }

          #[test]
          fn scalar_lookup_copies_and_shared_owner_lookup_does_not_clone() {
              let scalar = compile_source(
                  "items = seq int()\nappend items, 4\nlookup items, 0 as value\nprint value\nelse\nprint 0\nend\n",
              );
              assert!(scalar.contains("let __evo_value = *__evo_internal_lookup_value_"));

              let shared = compile_source(
                  "record Item\nvalue int\nend\nowners = seq shared Item()\nappend owners, share Item(value = 1)\nlookup owners, 0 as owner\nprint owner.value\nelse\nprint 0\nend\n",
              );
              assert!(shared.contains("Vec::<std::rc::Rc<__EvoRecord_Item>>::new()"));
              assert!(!shared.contains("Rc::clone"));
          }
          ''')

