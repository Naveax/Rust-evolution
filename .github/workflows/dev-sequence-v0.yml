      - name: Focused sequence tests
        run: |
          cargo test -p evo-parser --test sequence_v0
          cargo test -p evo-lowering --test sequence_v0
          cargo test -p evo-codegen-rust --test sequence_v0
          cargo test -p evo-formatter --test sequence_v0

      - name: Regression tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Remove one-shot mutation workflow
        run: rm .github/workflows/dev-sequence-v0.yml

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "Rust Evolution Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement append-only sequence v0 core"
          git push origin HEAD:feature/append-only-sequence-v0
