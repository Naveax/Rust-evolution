name: Dev sequence syntax v0

on:
  push:
    branches:
      - feature/append-only-sequence-v0

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/append-only-sequence-v0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Apply contextual sequence syntax slice
        run: python .github/dev/sequence_syntax_v0_patch.py

      - name: Format
        run: cargo fmt --all --check

      - name: Focused syntax tests
        run: |
          cargo test -p evo-parser --test sequence_syntax_v0
          cargo test -p evo-formatter --test sequence_syntax_v0

      - name: Workspace regression tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Remove one-shot mutation files
        run: rm .github/workflows/dev-sequence-v0.yml .github/dev/sequence_syntax_v0_patch.py

      - name: Commit validated syntax slice
        run: |
          git config user.name "Rust Evolution Dev Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add contextual sequence syntax v0"
          git push origin HEAD:feature/append-only-sequence-v0
