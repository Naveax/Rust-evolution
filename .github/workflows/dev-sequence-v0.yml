name: Dev sequence v0 patch

on:
  push:
    branches:
      - feature/append-only-sequence-v0

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/append-only-sequence-v0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Apply bounded sequence v0 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"non-unique patch anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          parser = "crates/evo-parser/src/lib.rs"
          replace_once(parser,
          '''pub enum TypeName {
              Int,
              Bool,
              String,
              Named(String),
              SharedOwner(String),
              SharedRef(Box<TypeName>),
          }''',
          '''pub enum TypeName {
              Int,
              Bool,
              String,
              Named(String),
              SharedOwner(String),
              SharedRef(Box<TypeName>),
              Sequence(Box<TypeName>),
          }''')

          replace_once(parser,
          '''    Match {
                  value: Expr,
                  arms: Vec<MatchArm>,
              },
          }''',
          '''    Match {
                  value: Expr,
                  arms: Vec<MatchArm>,
              },
              SequenceAppend {
                  owner: String,
                  value: Expr,
              },
              SequenceLookup {
                  owner: String,
                  index: Expr,
                  binding: String,
                  then_body: Vec<Stmt>,
                  else_body: Vec<Stmt>,
              },
          }''')

          replace_once(parser,
          '''    SharedDuplicate(Box<Expr>),
              Binary {''',
          '''    SharedDuplicate(Box<Expr>),
              SequenceNew {
                  element_type: TypeName,
              },
              Binary {''')

          replace_once(parser,
          '''    fn parse_record_field_type(&mut self) -> Result<RecordFieldType, ParseError> {
              if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared")''',
          '''    fn parse_record_field_type(&mut self) -> Result<RecordFieldType, ParseError> {
              if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "seq")
                  && self.sequence_element_type_starts_at(self.index + 1)
              {
                  return Err(self.error_here("sequence record fields are not supported in v0"));
              }
              if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared")''')

          replace_once(parser,
          '''                if matches!(self.current().kind, TokenKind::Ampersand) {
                          return Err(self
                              .error_here("immutable reference enum payloads are not supported in v0"));
                      }
                      if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared")''',
          '''                if matches!(self.current().kind, TokenKind::Ampersand) {
                          return Err(self
                              .error_here("immutable reference enum payloads are not supported in v0"));
                      }
                      if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "seq")
                          && self.sequence_element_type_starts_at(self.index + 1)
                      {
                          return Err(self.error_here("sequence enum payloads are not supported in v0"));
                      }
                      if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared")''')

          replace_once(parser,
          '''    fn parse_type_name(&mut self) -> Result<TypeName, ParseError> {
              if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared") {''',
          '''    fn parse_type_name(&mut self) -> Result<TypeName, ParseError> {
              if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "seq")
                  && self.sequence_element_type_starts_at(self.index + 1)
              {
                  self.advance();
                  let element_type = self.parse_sequence_element_type()?;
                  return Ok(TypeName::Sequence(Box::new(element_type)));
              }

              if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared") {''')

          replace_once(parser,
          '''    fn parse_owned_type_name(&mut self) -> Result<TypeName, ParseError> {
              let token = self.advance();''',
          '''    fn parse_sequence_element_type(&mut self) -> Result<TypeName, ParseError> {
              if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared") {
                  let marker = self.advance().span;
                  let token = self.advance();
                  return match token.kind {
                      TokenKind::Identifier(name) => Ok(TypeName::SharedOwner(name)),
                      _ => Err(ParseError {
                          message: "sequence shared-owner elements require a nominal record type"
                              .to_owned(),
                          span: marker.join(token.span),
                      }),
                  };
              }

              let token = self.advance();
              match token.kind {
                  TokenKind::TypeInt => Ok(TypeName::Int),
                  TokenKind::TypeBool => Ok(TypeName::Bool),
                  TokenKind::TypeString => Ok(TypeName::String),
                  TokenKind::Identifier(name) if name == "seq" => Err(ParseError {
                      message: "nested sequence element types are not supported in v0".to_owned(),
                      span: token.span,
                  }),
                  TokenKind::Identifier(name) => Ok(TypeName::Named(name)),
                  TokenKind::Ampersand => Err(ParseError {
                      message: "reference sequence element types are not supported in v0".to_owned(),
                      span: token.span,
                  }),
                  _ => Err(ParseError {
                      message: "expected sequence element type".to_owned(),
                      span: token.span,
                  }),
              }
          }

          fn sequence_element_type_starts_at(&self, index: usize) -> bool {
              match self.tokens.get(index).map(|token| &token.kind) {
                  Some(TokenKind::TypeInt | TokenKind::TypeBool | TokenKind::TypeString) => true,
                  Some(TokenKind::Identifier(name)) if name == "shared" => self
                      .tokens
                      .get(index + 1)
                      .is_some_and(|token| matches!(token.kind, TokenKind::Identifier(_))),
                  Some(TokenKind::Identifier(_)) => true,
                  _ => false,
              }
          }

              fn parse_owned_type_name(&mut self) -> Result<TypeName, ParseError> {
              let token = self.advance();''')

          replace_once(parser,
          '''            TokenKind::Identifier(name) => {
                  let start = self.advance().span;
                  if !matches!(self.current().kind, TokenKind::Equal) {
                      return Err(self.error_here("expected '=' after binding name"));
                  }
                  self.advance();
                  let expr = self.parse_expression()?;
                  let span = start.join(expr.span);
                  Ok(Stmt {
                      kind: StmtKind::Bind { name, expr },
                      span,
                  })
              }''',
          '''            TokenKind::Identifier(name) => {
                  let start = self.advance().span;
                  if name == "append" && !matches!(self.current().kind, TokenKind::Equal) {
                      return self.parse_sequence_append(start);
                  }
                  if name == "lookup" && !matches!(self.current().kind, TokenKind::Equal) {
                      return self.parse_sequence_lookup(start);
                  }
                  if !matches!(self.current().kind, TokenKind::Equal) {
                      return Err(self.error_here("expected '=' after binding name"));
                  }
                  self.advance();
                  let expr = self.parse_expression()?;
                  let span = start.join(expr.span);
                  Ok(Stmt {
                      kind: StmtKind::Bind { name, expr },
                      span,
                  })
              }''')

          replace_once(parser,
          '''    fn parse_repeat(&mut self) -> Result<Stmt, ParseError> {''',
          '''    fn parse_sequence_append(&mut self, start: Span) -> Result<Stmt, ParseError> {
              let owner_token = self.advance();
              let TokenKind::Identifier(owner) = owner_token.kind else {
                  return Err(ParseError {
                      message: "expected sequence owner after 'append'".to_owned(),
                      span: owner_token.span,
                  });
              };
              self.expect_kind(TokenKind::Comma, "expected ',' after sequence owner")?;
              let value = self.parse_expression()?;
              Ok(Stmt {
                  span: start.join(value.span),
                  kind: StmtKind::SequenceAppend { owner, value },
              })
          }

          fn parse_sequence_lookup(&mut self, start: Span) -> Result<Stmt, ParseError> {
              let owner_token = self.advance();
              let TokenKind::Identifier(owner) = owner_token.kind else {
                  return Err(ParseError {
                      message: "expected sequence owner after 'lookup'".to_owned(),
                      span: owner_token.span,
                  });
              };
              self.expect_kind(TokenKind::Comma, "expected ',' after sequence owner")?;
              let index = self.parse_expression()?;
              let as_token = self.advance();
              if !matches!(&as_token.kind, TokenKind::Identifier(name) if name == "as") {
                  return Err(ParseError {
                      message: "expected contextual 'as' after lookup index".to_owned(),
                      span: as_token.span,
                  });
              }
              let binding_token = self.advance();
              let TokenKind::Identifier(binding) = binding_token.kind else {
                  return Err(ParseError {
                      message: "expected success binding after lookup 'as'".to_owned(),
                      span: binding_token.span,
                  });
              };
              if !matches!(self.current().kind, TokenKind::Newline) {
                  return Err(self.error_here("expected end of line after lookup binding"));
              }
              self.skip_newlines();

              let mut then_body = Vec::new();
              while !matches!(self.current().kind, TokenKind::Else | TokenKind::End) {
                  if self.is_eof() {
                      return Err(self.error_here("missing 'else' and 'end' for lookup block"));
                  }
                  let statement = self.parse_statement()?;
                  self.require_statement_terminator()?;
                  then_body.push(statement);
                  self.skip_newlines();
              }
              if !matches!(self.current().kind, TokenKind::Else) {
                  return Err(self.error_here("checked lookup requires an explicit 'else' branch"));
              }
              self.advance();
              if !matches!(self.current().kind, TokenKind::Newline) {
                  return Err(self.error_here("expected end of line after lookup 'else'"));
              }
              self.skip_newlines();

              let mut else_body = Vec::new();
              while !matches!(self.current().kind, TokenKind::End) {
                  if self.is_eof() {
                      return Err(self.error_here("missing 'end' for lookup block"));
                  }
                  let statement = self.parse_statement()?;
                  self.require_statement_terminator()?;
                  else_body.push(statement);
                  self.skip_newlines();
              }
              let close = self.advance().span;
              Ok(Stmt {
                  kind: StmtKind::SequenceLookup {
                      owner,
                      index,
                      binding,
                      then_body,
                      else_body,
                  },
                  span: start.join(close),
              })
          }

              fn parse_repeat(&mut self) -> Result<Stmt, ParseError> {''')

          replace_once(parser,
          '''            TokenKind::Identifier(name) => self.parse_identifier_or_call(name, token.span),''',
          '''            TokenKind::Identifier(name) if name == "seq" && self.sequence_constructor_starts_here() => {
                  let element_type = self.parse_sequence_element_type()?;
                  self.expect_kind(TokenKind::LParen, "expected '(' after sequence element type")?;
                  let close = self.expect_kind(TokenKind::RParen, "expected ')' for empty sequence constructor")?.span;
                  Ok(Expr {
                      kind: ExprKind::SequenceNew { element_type },
                      span: token.span.join(close),
                  })
              }
              TokenKind::Identifier(name) => self.parse_identifier_or_call(name, token.span),''')

          replace_once(parser,
          '''    fn parse_identifier_or_call(&mut self, name: String, start: Span) -> Result<Expr, ParseError> {''',
          '''    fn sequence_constructor_starts_here(&self) -> bool {
              if !self.sequence_element_type_starts_at(self.index) {
                  return false;
              }
              let offset = if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared") {
                  2
              } else {
                  1
              };
              self.tokens
                  .get(self.index + offset)
                  .is_some_and(|token| matches!(token.kind, TokenKind::LParen))
          }

              fn parse_identifier_or_call(&mut self, name: String, start: Span) -> Result<Expr, ParseError> {''')

          semantic = "crates/evo-lowering/src/record_environment_records.rs"
          replace_once(semantic,
          '''    SharedRef(Box<SemanticType>),
          }''',
          '''    SharedRef(Box<SemanticType>),
              Sequence(Box<SemanticType>),
          }''')
          replace_once(semantic,
          '''        !matches!(self, Self::Record(_) | Self::SharedOwner(_))''',
          '''        !matches!(self, Self::Record(_) | Self::SharedOwner(_) | Self::Sequence(_))''')
          replace_once(semantic,
          '''            SyntaxTypeName::SharedRef(inner) => self
                  .resolve_type_name(inner, span)
                  .map(|inner| SemanticType::SharedRef(Box::new(inner))),''',
          '''            SyntaxTypeName::SharedRef(inner) => self
                  .resolve_type_name(inner, span)
                  .map(|inner| SemanticType::SharedRef(Box::new(inner))),
              SyntaxTypeName::Sequence(inner) => self
                  .resolve_type_name(inner, span)
                  .map(|inner| SemanticType::Sequence(Box::new(inner))),''')
          replace_once(semantic,
          '''        SemanticType::SharedRef(inner) => format!("&{}", semantic_type_label(inner)),''',
          '''        SemanticType::SharedRef(inner) => format!("&{}", semantic_type_label(inner)),
              SemanticType::Sequence(inner) => format!("seq {}", semantic_type_label(inner)),''')

          refs = "crates/evo-lowering/src/reference_state.rs"
          replace_once(refs,
          '''pub(crate) enum OwnerOperation {
              Move,
              Reinitialize,
          }''',
          '''pub(crate) enum OwnerOperation {
              Move,
              Reinitialize,
              Grow,
          }''')
          replace_once(refs,
          '''            Self::Reinitialize => "reinitialize",''',
          '''            Self::Reinitialize => "reinitialize",
                  Self::Grow => "grow",''')

          ownership = "crates/evo-lowering/src/record_ownership.rs"
          replace_once(ownership,
          '''        Some(SemanticType::SharedOwner(_)) => "shared handle",
              _ => "record",''',
          '''        Some(SemanticType::SharedOwner(_)) => "shared handle",
              Some(SemanticType::Sequence(_)) => "sequence",
              _ => "record",''')

          lowering = "crates/evo-lowering/src/lib.rs"
          replace_once(lowering,
          '''    If {
                  condition: Expr,
                  then_body: Vec<Stmt>,
                  else_body: Vec<Stmt>,
              },
          }''',
          '''    If {
                  condition: Expr,
                  then_body: Vec<Stmt>,
                  else_body: Vec<Stmt>,
              },
              SequenceAppend {
                  owner: String,
                  value: Expr,
              },
              SequenceLookup {
                  owner: String,
                  index: Expr,
                  binding: String,
                  binding_by_ref: bool,
                  then_body: Vec<Stmt>,
                  else_body: Vec<Stmt>,
              },
          }''')
          replace_once(lowering,
          '''    SharedDuplicate(Box<Expr>),
              Binary {''',
          '''    SharedDuplicate(Box<Expr>),
              SequenceNew(Box<ValueType>),
              Binary {''')
          replace_once(lowering,
          '''    SharedRef(Box<ValueType>),
          }''',
          '''    SharedRef(Box<ValueType>),
              Sequence(Box<ValueType>),
          }''')
          replace_once(lowering,
          '''        | StmtKind::Print(_)
              | StmtKind::Repeat { .. } => false,''',
          '''        | StmtKind::Print(_)
              | StmtKind::Repeat { .. }
              | StmtKind::SequenceAppend { .. }
              | StmtKind::SequenceLookup { .. } => false,''')
          replace_once(lowering,
          '''        ValueType::SharedRef(inner) => {
                  SemanticType::SharedRef(Box::new(semantic_type(inner)))
              }''',
          '''        ValueType::SharedRef(inner) => {
                  SemanticType::SharedRef(Box::new(semantic_type(inner)))
              }
              ValueType::Sequence(inner) => SemanticType::Sequence(Box::new(semantic_type(inner))),''')
          replace_once(lowering,
          '''        SemanticType::SharedRef(inner) => {
                  ValueType::SharedRef(Box::new(lowered_value_type(inner)))
              }''',
          '''        SemanticType::SharedRef(inner) => {
                  ValueType::SharedRef(Box::new(lowered_value_type(inner)))
              }
              SemanticType::Sequence(inner) => {
                  ValueType::Sequence(Box::new(lowered_value_type(inner)))
              }''')
          replace_once(lowering,
          '''        ValueType::SharedRef(inner) => format!("&{}", type_label(inner)),''',
          '''        ValueType::SharedRef(inner) => format!("&{}", type_label(inner)),
              ValueType::Sequence(inner) => format!("seq {}", type_label(inner)),''')
          replace_once(lowering,
          '''                        ValueType::SharedOwner(_) => self.reference_tracker.ensure_owner_operation_allowed(
                              name,
                              "shared handle",
                              OwnerOperation::Reinitialize,
                              statement.span,
                          )?,
                          _ => {}''',
          '''                        ValueType::SharedOwner(_) => self.reference_tracker.ensure_owner_operation_allowed(
                              name,
                              "shared handle",
                              OwnerOperation::Reinitialize,
                              statement.span,
                          )?,
                          ValueType::Sequence(_) => self.reference_tracker.ensure_owner_operation_allowed(
                              name,
                              "sequence",
                              OwnerOperation::Reinitialize,
                              statement.span,
                          )?,
                          _ => {}''')
          replace_once(lowering,
          '''            SyntaxStmtKind::If {
                  condition,
                  then_body,
                  else_body,
              } => {''',
          '''            SyntaxStmtKind::SequenceAppend { owner, value } => {
                  let owner_type = self.move_tracker.inspect_value(owner, statement.span)?;
                  let SemanticType::Sequence(element_type) = owner_type else {
                      return Err(LowerError {
                          message: format!("append requires a sequence owner; found {}", semantic_type_label_for_error(&owner_type)),
                          span: statement.span,
                      });
                  };
                  self.reference_tracker.ensure_owner_operation_allowed(
                      owner,
                      "sequence",
                      OwnerOperation::Grow,
                      statement.span,
                  )?;
                  let (value, actual_type) = self.lower_expr(value)?;
                  let expected_type = lowered_value_type(&element_type);
                  if actual_type != expected_type {
                      return Err(LowerError {
                          message: format!(
                              "sequence append expects {}, found {}",
                              type_label(&expected_type),
                              type_label(&actual_type)
                          ),
                          span: value.span,
                      });
                  }
                  StmtKind::SequenceAppend {
                      owner: owner.clone(),
                      value,
                  }
              }
              SyntaxStmtKind::SequenceLookup {
                  owner,
                  index,
                  binding,
                  then_body,
                  else_body,
              } => {
                  if self.visible_binding(binding).is_some() {
                      return Err(LowerError {
                          message: format!("lookup binding {binding:?} would shadow an existing visible binding"),
                          span: statement.span,
                      });
                  }
                  let owner_type = self.move_tracker.inspect_value(owner, statement.span)?;
                  let SemanticType::Sequence(element_type) = owner_type else {
                      return Err(LowerError {
                          message: format!("lookup requires a sequence owner; found {}", semantic_type_label_for_error(&owner_type)),
                          span: statement.span,
                      });
                  };
                  let (index, index_type) = self.lower_expr(index)?;
                  if index_type != ValueType::Integer {
                      return Err(LowerError {
                          message: "sequence lookup index must be an integer".to_owned(),
                          span: index.span,
                      });
                  }
                  let element_value_type = lowered_value_type(&element_type);
                  let binding_by_ref = !element_type.is_trivially_reusable_v0();
                  let binding_type = if binding_by_ref {
                      ValueType::SharedRef(Box::new(element_value_type.clone()))
                  } else {
                      element_value_type
                  };

                  let entry = self.move_tracker.clone();
                  self.move_tracker = entry.clone();
                  self.scopes.push(HashMap::new());
                  self.define_binding(binding.clone(), binding_type, statement.span.start);
                  if binding_by_ref {
                      self.reference_tracker.define_reference(
                          binding.clone(),
                          ReferenceProvenance::local_owner(owner.clone(), statement.span),
                      );
                  }
                  let then_body = self.lower_statements(then_body)?;
                  let locals = self.scopes.pop().expect("lookup success scope must exist");
                  for name in locals.keys() {
                      self.move_tracker.forget(name);
                      self.reference_tracker.forget(name);
                  }
                  let then_exit = self.move_tracker.clone();

                  self.move_tracker = entry.clone();
                  let else_body = self.lower_child_scope(else_body)?;
                  let else_exit = self.move_tracker.clone();

                  let then_returns = block_always_returns(&then_body);
                  let else_returns = block_always_returns(&else_body);
                  let mut merged = entry;
                  match (then_returns, else_returns) {
                      (false, false) => merged.merge_if(&then_exit, &else_exit),
                      (true, false) => {
                          let continues = merged.merge_if_continuing(None, Some(&else_exit));
                          debug_assert!(continues);
                      }
                      (false, true) => {
                          let continues = merged.merge_if_continuing(Some(&then_exit), None);
                          debug_assert!(continues);
                      }
                      (true, true) => {
                          let continues = merged.merge_if_continuing(None, None);
                          debug_assert!(!continues);
                      }
                  }
                  self.move_tracker = merged;

                  StmtKind::SequenceLookup {
                      owner: owner.clone(),
                      index,
                      binding: binding.clone(),
                      binding_by_ref,
                      then_body,
                      else_body,
                  }
              }
              SyntaxStmtKind::If {
                  condition,
                  then_body,
                  else_body,
              } => {''')
          replace_once(lowering,
          '''                        ValueType::SharedOwner(_) => self.reference_tracker.ensure_owner_operation_allowed(
                              name,
                              "shared handle",
                              OwnerOperation::Move,
                              expr.span,
                          )?,
                          _ => {}''',
          '''                        ValueType::SharedOwner(_) => self.reference_tracker.ensure_owner_operation_allowed(
                              name,
                              "shared handle",
                              OwnerOperation::Move,
                              expr.span,
                          )?,
                          ValueType::Sequence(_) => self.reference_tracker.ensure_owner_operation_allowed(
                              name,
                              "sequence",
                              OwnerOperation::Move,
                              expr.span,
                          )?,
                          _ => {}''')
          replace_once(lowering,
          '''            SyntaxExprKind::SharedDuplicate(inner) => {''',
          '''            SyntaxExprKind::SequenceNew { element_type } => {
                  let element_type = self.record_environment.resolve_type_name(element_type, expr.span)?;
                  let element_type = lowered_value_type(&element_type);
                  (
                      ExprKind::SequenceNew(Box::new(element_type.clone())),
                      ValueType::Sequence(Box::new(element_type)),
                  )
              }
              SyntaxExprKind::SharedDuplicate(inner) => {''')
          replace_once(lowering,
          '''            ValueType::SharedRef(_) => Err(LowerError {
                  message: "nested immutable references are not supported in v0".to_owned(),
                  span,
              }),
              ValueType::Integer | ValueType::Bool | ValueType::String => Err(LowerError {''',
          '''            ValueType::SharedRef(_) => Err(LowerError {
                  message: "nested immutable references are not supported in v0".to_owned(),
                  span,
              }),
              ValueType::Sequence(_) => Err(LowerError {
                  message: "direct immutable borrowing of a sequence is not supported in sequence v0; use checked lookup for element access".to_owned(),
                  span,
              }),
              ValueType::Integer | ValueType::Bool | ValueType::String => Err(LowerError {''')
          replace_once(lowering,
          '''            | SyntaxExprKind::SharedDuplicate(_)
              | SyntaxExprKind::Binary { .. } => Ok(None),''',
          '''            | SyntaxExprKind::SharedDuplicate(_)
              | SyntaxExprKind::SequenceNew { .. }
              | SyntaxExprKind::Binary { .. } => Ok(None),''')
          replace_once(lowering,
          '''                    ValueType::Integer | ValueType::Bool | ValueType::String => {
                          Err(LowerError {''',
          '''                    ValueType::Sequence(_) => Err(LowerError {
                          message: "direct immutable borrowing of a sequence is not supported in sequence v0; use checked lookup for element access".to_owned(),
                          span: target.span,
                      }),
                      ValueType::Integer | ValueType::Bool | ValueType::String => {
                          Err(LowerError {''')
          replace_once(lowering,
          '''        SyntaxStmtKind::Match { value, arms } => {
              Self::collect_expr_identifier_uses(value, uses);''',
          '''        SyntaxStmtKind::SequenceAppend { owner, value } => {
              *uses.entry(owner.clone()).or_insert(0) += 1;
              Self::collect_expr_identifier_uses(value, uses);
          }
          SyntaxStmtKind::SequenceLookup {
              owner,
              index,
              then_body,
              else_body,
              ..
          } => {
              *uses.entry(owner.clone()).or_insert(0) += 1;
              Self::collect_expr_identifier_uses(index, uses);
              for statement in then_body {
                  Self::collect_statement_identifier_uses(statement, uses);
              }
              for statement in else_body {
                  Self::collect_statement_identifier_uses(statement, uses);
              }
          }
          SyntaxStmtKind::Match { value, arms } => {
              Self::collect_expr_identifier_uses(value, uses);''')
