name: DEV immutable reference provenance bootstrap v4

on:
  push:
    branches:
      - feature/immutable-reference-surface-v0
    paths:
      - .github/workflows/dev-reference-provenance-bootstrap-v4.yml

permissions:
  contents: write

concurrency:
  group: dev-reference-provenance-bootstrap-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/immutable-reference-surface-v0
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Apply provenance patch with source-bounded edits
        shell: python
        run: |
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/dev-reference-provenance-bootstrap.yml").read_text().splitlines()
          marker = workflow.index("      - name: Apply first-class reference provenance core")
          run_line = next(i for i in range(marker + 1, len(workflow)) if workflow[i] == "        run: |")
          end = next(i for i in range(run_line + 1, len(workflow)) if workflow[i] == "      - name: Format")
          prefix = "          "
          code = "\n".join(
              line[len(prefix):] if line.startswith(prefix) else line
              for line in workflow[run_line + 1:end]
          )

          call_replacement = r'''call_path = Path(lower)
          call_text = call_path.read_text()
          call_start = "                        let mut lowered_arguments = Vec::with_capacity(arguments.len());\n"
          call_end = "                    }\n                }\n            }\n            SyntaxExprKind::Construct"
          start = call_text.index(call_start)
          end_index = call_text.index(call_end, start)
          new_call_loop = """                        let mut lowered_arguments = Vec::with_capacity(arguments.len());
                          let mut argument_modes = Vec::with_capacity(arguments.len());
                          for (index, ((argument, expected_type), passing_mode)) in arguments
                              .iter()
                              .zip(&signature.parameter_types)
                              .zip(&signature.parameter_modes)
                              .enumerate()
                          {
                              let (argument, actual_type, effective_mode) = self.lower_call_argument(
                                  argument,
                                  expected_type,
                                  *passing_mode,
                              )?;
                              if &actual_type != expected_type {
                                  return Err(LowerError {
                                      message: format!(
                                          "argument {} for function {name:?} expects {}, found {}",
                                          index + 1,
                                          type_label(expected_type),
                                          type_label(&actual_type)
                                      ),
                                      span: argument.span,
                                  });
                              }
                              lowered_arguments.push(argument);
                              argument_modes.push(effective_mode);
                          }
                          (
                              ExprKind::Call {
                                  name: name.clone(),
                                  arguments: lowered_arguments,
                                  argument_modes,
                              },
                              signature.return_type,
                          )
          """
          call_path.write_text(call_text[:start] + new_call_loop + call_text[end_index:])'''
          code, count = re.subn(
              r'old_call_loop = """.*?replace_once\(lower, old_call_loop, new_call_loop\)',
              lambda _: call_replacement,
              code,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("failed to replace call-loop patch fragment")

          staging_replacement = r'''p = Path(lower)
          text = p.read_text()
          staging_start = text.index(
              "    #[test]\n    fn keeps_explicit_borrow_creation_fail_closed_until_provenance_tracking() {\n"
          )
          staging_end = text.index(
              "    #[test]\n    fn reads_scalar_fields_through_reference_parameters() {\n",
              staging_start,
          )
          p.write_text(text[:staging_start] + text[staging_end:])'''
          code, count = re.subn(
              r'# The staging test from the previous semantic slice is superseded.*?p\.write_text\(text\.replace\(old_staging_test, "", 1\)\)',
              lambda _: staging_replacement,
              code,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("failed to replace staging-test patch fragment")

          code = code.replace(
              "OwnerOperation, ReferenceProvenance, ReferenceSource, ReferenceTracker,",
              "OwnerOperation, ReferenceProvenance, ReferenceTracker,",
          )
          code = code.replace(
              "            target.kind,\n            SyntaxExprKind::Identifier(_) | SyntaxExprKind::FieldAccess { .. }",
              "            &target.kind,\n            SyntaxExprKind::Identifier(_) | SyntaxExprKind::FieldAccess { .. }",
          )
          exec(compile(code, "dev-reference-provenance-bootstrap-v4", "exec"), {})

      - name: Format
        run: cargo +1.98.0 fmt --all

      - name: Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo +1.98.0 test --workspace

      - name: Verify diff
        run: git diff --check

      - name: Commit verified provenance core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/evo-lowering/src/reference_state.rs crates/evo-lowering/src/lib.rs crates/evo-codegen-rust/src/lib.rs
          git diff --cached --check
          git commit -m "feat: track immutable reference provenance"
          git push origin HEAD:feature/immutable-reference-surface-v0
