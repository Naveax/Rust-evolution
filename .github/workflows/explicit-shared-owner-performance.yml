name: Explicit shared owner performance

on:
  pull_request:
    paths:
      - 'benchmarks/cases/explicit-shared-owner-v0/**'
      - 'crates/evo-parser/**'
      - 'crates/evo-lowering/**'
      - 'crates/evo-codegen-rust/**'
      - 'crates/evo-bench/src/**'
      - 'crates/evo-bench/Cargo.toml'
      - 'crates/evo-bench/tests/explicit_shared_owner_reference.rs'
      - '.github/workflows/explicit-shared-owner-performance.yml'
  push:
    branches:
      - main
    paths:
      - 'benchmarks/cases/explicit-shared-owner-v0/**'
      - 'crates/evo-parser/**'
      - 'crates/evo-lowering/**'
      - 'crates/evo-codegen-rust/**'
      - 'crates/evo-bench/src/**'
      - 'crates/evo-bench/Cargo.toml'
      - 'crates/evo-bench/tests/explicit_shared_owner_reference.rs'
      - '.github/workflows/explicit-shared-owner-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rc-parity:
    name: ubuntu-24.04 / Rust 1.98.0
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout provenance
        env:
          EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_GIT_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Shared owner focused tests
        run: |
          cargo test -p evo-parser --test shared_handle_surface
          cargo test -p evo-lowering --test shared_owner_v0
          cargo test -p evo-codegen-rust --test shared_owner_v0
          cargo test -p evo-codegen-rust --test shared_owner_compile
          cargo test -p evo-bench --test explicit_shared_owner_reference

      - name: Explicit shared owner Rc parity gate
        env:
          EVO_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/explicit-shared-owner-v0 --out target/evo-bench-explicit-shared-owner

      - name: Validate benchmark provenance
        env:
          EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('target/evo-bench-explicit-shared-owner/report.json').read_text())
          assert report['schema_version'] == 3, report
          assert report['git_sha'] == os.environ['EXPECTED_GIT_SHA'], report
          assert report['build_flags'] == [
              '--crate-name',
              'evo_benchmark_case',
              '--edition=2024',
              '-C',
              'opt-level=3',
              '-C',
              'codegen-units=1',
              '-C',
              'lto=thin',
              '-C',
              'debuginfo=0',
          ], report
          assert report['host_os'], report
          assert report['host_arch'], report
          assert report['ci_provider'] == 'github-actions', report
          assert report['runner_name'], report
          assert report['runner_os'], report
          assert report['runner_arch'], report
          assert report['target'], report
          assert report['rustc_verbose'], report
          print(json.dumps({
              'git_sha': report['git_sha'],
              'target': report['target'],
              'host_os': report['host_os'],
              'host_arch': report['host_arch'],
              'build_flags': report['build_flags'],
          }, indent=2))
          PY

      - name: Upload explicit shared owner report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-explicit-shared-owner-ubuntu-24.04
          path: target/evo-bench-explicit-shared-owner/
          if-no-files-found: warn
