name: Stage shared owner enum-boundary diagnostics

on:
  push:
    branches:
      - integration/explicit-shared-handle-v0-final
    paths:
      - '.github/workflows/stage-explicit-shared-owner-enum-boundary.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/explicit-shared-handle-v0-final

      - name: Patch fail-closed enum-boundary diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/evo-lowering/src/enum_static_semantics.rs')
          text = path.read_text()

          old_expr = '''            SyntaxExprKind::SharedBorrow(_)
                      | SyntaxExprKind::SharedAlloc(_)
                      | SyntaxExprKind::SharedDuplicate(_) => Err(LowerError {
                          message: "immutable reference semantic lowering is not implemented yet".to_owned(),
                          span: expr.span,
                      }),
          '''
          new_expr = '''            SyntaxExprKind::SharedBorrow(_) => Err(LowerError {
                          message: "immutable reference expressions are not supported in enum-bearing programs in v0"
                              .to_owned(),
                          span: expr.span,
                      }),
                      SyntaxExprKind::SharedAlloc(_) | SyntaxExprKind::SharedDuplicate(_) => {
                          Err(LowerError {
                              message: "explicit shared-owner expressions are not supported in enum-bearing programs in v0"
                                  .to_owned(),
                              span: expr.span,
                          })
                      }
          '''
          if old_expr not in text:
              raise SystemExit('expected enum expression rejection block not found')
          text = text.replace(old_expr, new_expr, 1)

          old_type = '''        TypeName::SharedRef(_) | TypeName::SharedOwner(_) => Err(LowerError {
                      message: "immutable reference semantic lowering is not implemented yet".to_owned(),
                      span,
                  }),
          '''
          new_type = '''        TypeName::SharedRef(_) => Err(LowerError {
                      message: "immutable reference function contracts are not supported in enum-bearing programs in v0"
                          .to_owned(),
                      span,
                  }),
                  TypeName::SharedOwner(_) => Err(LowerError {
                      message: "explicit shared-owner function contracts are not supported in enum-bearing programs in v0"
                          .to_owned(),
                      span,
                  }),
          '''
          if old_type not in text:
              raise SystemExit('expected enum type rejection block not found')
          text = text.replace(old_type, new_type, 1)

          marker = '''    #[test]
              fn exhaustive_match_can_satisfy_function_return_path() {
                  validate(
                      "enum Flag\\nOff\\nOn\\nend\\nfn choose(value Flag) int\\nmatch value\\ncase Flag.Off\\nreturn 0\\ncase Flag.On\\nreturn 1\\nend\\nend\\n",
                  )
                  .expect("exhaustive terminal match should satisfy function return analysis");
              }
          '''
          addition = marker + '''
              #[test]
              fn enum_bearing_programs_reject_explicit_shared_owner_expressions_clearly() {
                  let error = validate(
                      "record Item\\nvalue int\\nend\\nenum Flag\\nOff\\nOn\\nend\\nowner = share Item(value = 1)\\n",
                  )
                  .expect_err("shared-owner expressions remain outside the enum-bearing v0 path");
                  assert!(error.message.contains("explicit shared-owner expressions"));
                  assert!(error.message.contains("enum-bearing programs"));
              }

              #[test]
              fn enum_bearing_programs_reject_explicit_shared_owner_contracts_clearly() {
                  let error = validate(
                      "record Item\\nvalue int\\nend\\nenum Flag\\nOff\\nOn\\nend\\nfn take(item shared Item) int\\nreturn item.value\\nend\\n",
                  )
                  .expect_err("shared-owner contracts remain outside the enum-bearing v0 path");
                  assert!(error.message.contains("explicit shared-owner function contracts"));
                  assert!(error.message.contains("enum-bearing programs"));
              }
          '''
          if marker not in text:
              raise SystemExit('expected final enum semantics test marker not found')
          text = text.replace(marker, addition, 1)
          path.write_text(text)
          PY

      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Format and test focused boundary
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p evo-lowering enum_bearing_programs_reject_explicit_shared_owner

      - name: Commit patch and remove bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/evo-lowering/src/enum_static_semantics.rs
          git rm .github/workflows/stage-explicit-shared-owner-enum-boundary.yml
          git commit -m 'fix: clarify shared owner enum-bearing boundary'
          git push origin HEAD:integration/explicit-shared-handle-v0-final
