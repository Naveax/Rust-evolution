name: Append-only sequence performance

on:
  pull_request:
    paths:
      - 'benchmarks/cases/append-only-sequence-v0/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/evo-parser/src/**'
      - 'crates/evo-parser/Cargo.toml'
      - 'crates/evo-lowering/src/**'
      - 'crates/evo-lowering/Cargo.toml'
      - 'crates/evo-codegen-rust/src/**'
      - 'crates/evo-codegen-rust/Cargo.toml'
      - 'crates/evo-bench/src/**'
      - 'crates/evo-bench/Cargo.toml'
      - 'crates/evo-bench/tests/append_only_sequence_reference.rs'
      - '.github/workflows/append-only-sequence-performance.yml'
  push:
    branches:
      - main
    paths:
      - 'benchmarks/cases/append-only-sequence-v0/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/evo-parser/src/**'
      - 'crates/evo-parser/Cargo.toml'
      - 'crates/evo-lowering/src/**'
      - 'crates/evo-lowering/Cargo.toml'
      - 'crates/evo-codegen-rust/src/**'
      - 'crates/evo-codegen-rust/Cargo.toml'
      - 'crates/evo-bench/src/**'
      - 'crates/evo-bench/Cargo.toml'
      - 'crates/evo-bench/tests/append_only_sequence_reference.rs'
      - '.github/workflows/append-only-sequence-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vec-parity:
    name: ubuntu-24.04 / Rust 1.98.0
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout provenance
        env:
          EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_GIT_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Append-only sequence focused tests
        run: |
          cargo test -p evo-parser --test sequence_syntax_v0
          cargo test -p evo-lowering --test sequence_v0
          cargo test -p evo-codegen-rust --test sequence_v0
          cargo test -p evo-codegen-rust --test sequence_compile
          cargo test -p evo-bench --test append_only_sequence_reference

      - name: Append-only sequence Vec parity gate
        env:
          EVO_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVO_REQUIRE_GIT_SHA: '1'
        run: cargo run -p evo-bench -- run benchmarks/cases/append-only-sequence-v0 --out target/evo-bench-append-only-sequence

      - name: Validate benchmark provenance
        env:
          EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('target/evo-bench-append-only-sequence/report.json').read_text())
          assert report['schema_version'] == 3, report
          assert report['git_sha'] == os.environ['EXPECTED_GIT_SHA'], report
          assert report['build_flags'] == [
              '--crate-name',
              'evo_benchmark_case',
              '--edition=2024',
              '-C',
              'opt-level=3',
              '-C',
              'codegen-units=1',
              '-C',
              'lto=thin',
              '-C',
              'debuginfo=0',
          ], report
          assert report['host_os'], report
          assert report['host_arch'], report
          assert report['ci_provider'] == 'github-actions', report
          assert report['runner_name'], report
          assert report['runner_os'], report
          assert report['runner_arch'], report
          assert report['target'], report
          assert report['rustc_verbose'], report
          print(json.dumps({
              'git_sha': report['git_sha'],
              'target': report['target'],
              'host_os': report['host_os'],
              'host_arch': report['host_arch'],
              'build_flags': report['build_flags'],
          }, indent=2))
          PY

      - name: Upload append-only sequence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evo-bench-append-only-sequence-ubuntu-24.04
          path: target/evo-bench-append-only-sequence/
          if-no-files-found: warn
