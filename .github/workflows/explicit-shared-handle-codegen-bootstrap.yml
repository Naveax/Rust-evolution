name: Bootstrap explicit shared handle codegen

on:
  push:
    branches:
      - feature/explicit-shared-handle-v0
    paths:
      - '.github/workflows/explicit-shared-handle-codegen-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/explicit-shared-handle-v0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply direct Rc codegen patch
        run: python3 .github/scripts/bootstrap_explicit_shared_codegen.py

      - name: Format and validate codegen slice
        run: |
          cargo fmt --all
          cargo check -p evo-codegen-rust --all-targets
          cargo clippy -p evo-codegen-rust --all-targets -- -D warnings
          cargo test -p evo-lowering --test shared_owner_v0
          cargo test -p evo-codegen-rust --test shared_owner_v0
          cargo test -p evo-codegen-rust --test shared_owner_compile

      - name: Commit codegen slice and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/explicit-shared-handle-codegen-bootstrap.yml
          rm .github/scripts/bootstrap_explicit_shared_codegen.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/evo-lowering/src/lib.rs crates/evo-codegen-rust/src/lib.rs .github/workflows/explicit-shared-handle-codegen-bootstrap.yml .github/scripts/bootstrap_explicit_shared_codegen.py
          git commit -m 'feat: lower explicit shared owners directly to Rc'
          git push origin HEAD:feature/explicit-shared-handle-v0
