name: Dev cross-thread clippy fix

on:
  push:
    paths:
      - '.github/workflows/dev-cross-thread-clippy-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/cross-thread-shared-ownership-v0

      - name: Keep captured stdout explicitly diagnostic-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/evo-lowering/tests/cross_thread_shared_ownership_research.rs')
          s = p.read_text()
          s = s.replace('    stdout: String,\n', '    _stdout: String,\n')
          s = s.replace('            stdout: String::new(),\n', '            _stdout: String::new(),\n')
          s = s.replace('        stdout,\n', '        _stdout: stdout,\n')
          p.write_text(s)
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo fmt --all
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/evo-lowering/tests/cross_thread_shared_ownership_research.rs
          git commit -m "test: satisfy Clippy in cross-thread research"
          git push origin HEAD:research/cross-thread-shared-ownership-v0
