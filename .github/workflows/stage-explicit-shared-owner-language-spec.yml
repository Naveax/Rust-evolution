name: Stage explicit shared owner language spec

on:
  push:
    branches:
      - staging/explicit-shared-handle-docs
    paths:
      - '.github/workflows/stage-explicit-shared-owner-language-spec.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          ref: staging/explicit-shared-handle-docs

      - name: Apply bounded language-spec patch
        run: python3 .github/scripts/stage_explicit_shared_owner_language_spec.py

      - name: Validate patch shape
        run: |
          git diff --check
          grep -F 'shared Item -> std::rc::Rc<__EvoRecord_Item>' docs/LANGUAGE_SPEC_V0.md
          grep -F 'explicit-shared-owner-v0' docs/LANGUAGE_SPEC_V0.md
          grep -F 'shared`, `share`, and `dup` remain ordinary identifier tokens' docs/LANGUAGE_SPEC_V0.md

      - name: Commit staged spec and remove bootstrap
        run: |
          rm .github/workflows/stage-explicit-shared-owner-language-spec.yml
          rm .github/scripts/stage_explicit_shared_owner_language_spec.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LANGUAGE_SPEC_V0.md .github/workflows/stage-explicit-shared-owner-language-spec.yml .github/scripts/stage_explicit_shared_owner_language_spec.py
          git commit -m 'docs: specify explicit shared owner handles v0'
          git push origin HEAD:staging/explicit-shared-handle-docs
