name: Dev record handle payloads

on:
  push:
    branches:
      - feature/generational-arena-v0
    paths:
      - '.github/workflows/dev-record-handle-payloads.yml'

permissions:
  contents: write

concurrency:
  group: dev-record-handle-payloads
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/generational-arena-v0
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Apply full record handle payload support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing: {label} in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "crates/evo-parser/src/lib.rs",
              """pub enum RecordFieldType {
              Int,
              Bool,
              String,
              Named(String),
              Handle(String),
          }""",
              """pub enum RecordFieldType {
              Int,
              Bool,
              String,
              Named(String),
              Handle(Box<TypeName>),
          }""",
              "parser RecordFieldType",
          )

          replace(
              "crates/evo-parser/src/lib.rs",
              """        if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "handle") {
                      let marker = self.advance().span;
                      let token = self.advance();
                      return match token.kind {
                          TokenKind::Identifier(name) => Ok(RecordFieldType::Handle(name)),
                          _ => Err(ParseError {
                              message: "record handle fields require a nominal record type".to_owned(),
                              span: marker.join(token.span),
                          }),
                      };
                  }""",
              """        if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "handle") {
                      let marker = self.advance().span;
                      if !self.arena_element_type_starts_at(self.index) {
                          return Err(ParseError {
                              message: "record handle fields require an arena payload type".to_owned(),
                              span: marker,
                          });
                      }
                      return Ok(RecordFieldType::Handle(Box::new(
                          self.parse_arena_element_type()?,
                      )));
                  }""",
              "parser record handle parser",
          )

          replace(
              "crates/evo-lowering/src/record_ir.rs",
              """use evo_parser::{Program as SyntaxProgram, RecordFieldType as SyntaxFieldType};""",
              """use evo_parser::{
              Program as SyntaxProgram, RecordFieldType as SyntaxFieldType, TypeName as SyntaxTypeName,
          };""",
              "record ir import",
          )

          replace(
              "crates/evo-lowering/src/record_ir.rs",
              """#[derive(Debug, Clone, PartialEq, Eq)]
          pub enum RecordType {
              Integer,
              Bool,
              String,
              Named(String),
              Handle(String),
          }""",
              """#[derive(Debug, Clone, PartialEq, Eq)]
          pub enum RecordHandleType {
              Integer,
              Bool,
              String,
              Record(String),
              SharedOwner(String),
          }

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub enum RecordType {
              Integer,
              Bool,
              String,
              Named(String),
              Handle(RecordHandleType),
          }""",
              "record handle ir enum",
          )

          replace(
              "crates/evo-lowering/src/record_ir.rs",
              """        SyntaxFieldType::Named(name) => RecordType::Named(name.clone()),
                  SyntaxFieldType::Handle(name) => RecordType::Handle(name.clone()),
              }
          }""",
              """        SyntaxFieldType::Named(name) => RecordType::Named(name.clone()),
                  SyntaxFieldType::Handle(payload) => RecordType::Handle(lower_handle_type(payload)),
              }
          }

          fn lower_handle_type(type_name: &SyntaxTypeName) -> RecordHandleType {
              match type_name {
                  SyntaxTypeName::Int => RecordHandleType::Integer,
                  SyntaxTypeName::Bool => RecordHandleType::Bool,
                  SyntaxTypeName::String => RecordHandleType::String,
                  SyntaxTypeName::Named(name) => RecordHandleType::Record(name.clone()),
                  SyntaxTypeName::SharedOwner(name) => RecordHandleType::SharedOwner(name.clone()),
                  SyntaxTypeName::SharedRef(_)
                  | SyntaxTypeName::Sequence(_)
                  | SyntaxTypeName::Arena(_)
                  | SyntaxTypeName::Handle(_) => {
                      unreachable!("parser restricts record handle fields to arena payload types")
                  }
              }
          }""",
              "record ir lower handle",
          )

          replace(
              "crates/evo-lowering/src/record_environment_records.rs",
              """                SyntaxFieldType::Handle(name) => {
                              if !record_names.contains_key(name) {
                                  return Err(LowerError {
                                      message: format!(
                                          "unknown record type {name:?} for handle field {:?} in record {:?}",
                                          field.name, record.name
                                      ),
                                      span: field.span,
                                  });
                              }
                              SemanticType::Handle(Box::new(SemanticType::Record(name.clone())))
                          }""",
              """                SyntaxFieldType::Handle(payload) => SemanticType::Handle(Box::new(
                              resolve_record_handle_payload(
                                  payload,
                                  record_names,
                                  &field.name,
                                  &record.name,
                                  field.span,
                              )?,
                          )),""",
              "record environment handle branch",
          )

          env = Path("crates/evo-lowering/src/record_environment_records.rs")
          text = env.read_text()
          anchor = "fn reject_recursive_by_value_layouts(schemas: &[RecordSchema]) -> Result<(), LowerError> {"
          if anchor not in text:
              raise SystemExit("anchor missing: record handle resolver insertion")
          helper = """fn resolve_record_handle_payload(
              payload: &SyntaxTypeName,
              record_names: &HashMap<String, Span>,
              field_name: &str,
              record_name: &str,
              span: Span,
          ) -> Result<SemanticType, LowerError> {
              match payload {
                  SyntaxTypeName::Int => Ok(SemanticType::Integer),
                  SyntaxTypeName::Bool => Ok(SemanticType::Bool),
                  SyntaxTypeName::String => Ok(SemanticType::String),
                  SyntaxTypeName::Named(name) => {
                      if record_names.contains_key(name) {
                          Ok(SemanticType::Record(name.clone()))
                      } else {
                          Err(LowerError {
                              message: format!(
                                  "unknown record type {name:?} for handle field {field_name:?} in record {record_name:?}"
                              ),
                              span,
                          })
                      }
                  }
                  SyntaxTypeName::SharedOwner(name) => {
                      if record_names.contains_key(name) {
                          Ok(SemanticType::SharedOwner(name.clone()))
                      } else {
                          Err(LowerError {
                              message: format!(
                                  "unknown shared-owner record type {name:?} for handle field {field_name:?} in record {record_name:?}"
                              ),
                              span,
                          })
                      }
                  }
                  SyntaxTypeName::SharedRef(_)
                  | SyntaxTypeName::Sequence(_)
                  | SyntaxTypeName::Arena(_)
                  | SyntaxTypeName::Handle(_) => Err(LowerError {
                      message: "record handle fields require an arena payload type".to_owned(),
                      span,
                  }),
              }
          }

          """
          env.write_text(text.replace(anchor, helper + anchor, 1))

          replace(
              "crates/evo-lowering/src/lib.rs",
              """pub use record_ir::{RecordFieldIr, RecordIr, RecordType};""",
              """pub use record_ir::{RecordFieldIr, RecordHandleType, RecordIr, RecordType};""",
              "record handle export",
          )

          replace(
              "crates/evo-codegen-rust/src/lib.rs",
              """    BinaryOp, Expr, ExprKind, Function, ParameterPassingMode, Program, RecordIr, RecordType, Stmt,
              StmtKind, ValueType,
          };""",
              """    BinaryOp, Expr, ExprKind, Function, ParameterPassingMode, Program, RecordHandleType, RecordIr,
              RecordType, Stmt, StmtKind, ValueType,
          };""",
              "codegen import",
          )

          replace(
              "crates/evo-codegen-rust/src/lib.rs",
              """        RecordType::Named(name) => generated_record_name(name),
                  RecordType::Handle(name) => format!("__EvoHandle<{}>", generated_record_name(name)),
              }
          }""",
              """        RecordType::Named(name) => generated_record_name(name),
                  RecordType::Handle(payload) => {
                      format!("__EvoHandle<{}>", rust_record_handle_type(payload))
                  }
              }
          }

          fn rust_record_handle_type(value_type: &RecordHandleType) -> String {
              match value_type {
                  RecordHandleType::Integer => "i64".to_owned(),
                  RecordHandleType::Bool => "bool".to_owned(),
                  RecordHandleType::String => "&'static str".to_owned(),
                  RecordHandleType::Record(name) => generated_record_name(name),
                  RecordHandleType::SharedOwner(name) => {
                      format!("std::rc::Rc<{}>", generated_record_name(name))
                  }
              }
          }""",
              "codegen record handle rendering",
          )

          replace(
              "crates/evo-parser/tests/arena_syntax_v0.rs",
              """        RecordFieldType::Handle("Node".to_owned())""",
              """        RecordFieldType::Handle(Box::new(TypeName::Named("Node".to_owned())))""",
              "parser nominal handle expectation",
          )

          p = Path("crates/evo-parser/tests/arena_syntax_v0.rs")
          p.write_text(p.read_text() + """
          
          #[test]
          fn record_handle_fields_accept_full_arena_payload_set() {
              let program = parse_source(
                  "record Item\nvalue int\nend\nrecord Handles\ninteger handle int\nboolean handle bool\ntext handle string\nrecord handle Item\nshared_owner handle shared Item\nend\n",
              );
              let fields = &program.records[1].fields;
              assert_eq!(fields[0].type_name, RecordFieldType::Handle(Box::new(TypeName::Int)));
              assert_eq!(fields[1].type_name, RecordFieldType::Handle(Box::new(TypeName::Bool)));
              assert_eq!(fields[2].type_name, RecordFieldType::Handle(Box::new(TypeName::String)));
              assert_eq!(
                  fields[3].type_name,
                  RecordFieldType::Handle(Box::new(TypeName::Named("Item".to_owned())))
              );
              assert_eq!(
                  fields[4].type_name,
                  RecordFieldType::Handle(Box::new(TypeName::SharedOwner("Item".to_owned())))
              );
          }
          """)

          replace(
              "crates/evo-lowering/tests/arena_semantics_v0.rs",
              """use evo_lowering::{RecordType, StmtKind, ValueType, lower};""",
              """use evo_lowering::{RecordHandleType, RecordType, StmtKind, ValueType, lower};""",
              "lowering test import",
          )

          replace(
              "crates/evo-lowering/tests/arena_semantics_v0.rs",
              """        RecordType::Handle("Node".to_owned())""",
              """        RecordType::Handle(RecordHandleType::Record("Node".to_owned()))""",
              "lowering nominal handle expectation",
          )

          p = Path("crates/evo-lowering/tests/arena_semantics_v0.rs")
          p.write_text(p.read_text() + """
          
          #[test]
          fn record_handle_fields_preserve_full_arena_payload_types() {
              let program = lower_source(
                  "record Item\nvalue int\nend\nrecord Handles\ninteger handle int\nboolean handle bool\ntext handle string\nrecord handle Item\nshared_owner handle shared Item\nend\n",
              )
              .expect("record handle fields should accept the full arena payload set");
              let fields = &program.records[1].fields;
              assert_eq!(fields[0].value_type, RecordType::Handle(RecordHandleType::Integer));
              assert_eq!(fields[1].value_type, RecordType::Handle(RecordHandleType::Bool));
              assert_eq!(fields[2].value_type, RecordType::Handle(RecordHandleType::String));
              assert_eq!(
                  fields[3].value_type,
                  RecordType::Handle(RecordHandleType::Record("Item".to_owned()))
              );
              assert_eq!(
                  fields[4].value_type,
                  RecordType::Handle(RecordHandleType::SharedOwner("Item".to_owned()))
              );
          }
          """)

          p = Path("crates/evo-codegen-rust/tests/arena_compile.rs")
          p.write_text(p.read_text() + """
          
          #[test]
          fn generated_record_handle_fields_cover_full_arena_payload_set() {
              let (binary, rust) = compile(
                  "record-handle-payloads",
                  "record Item\nvalue int\nend\nrecord Handles\ninteger handle int\nboolean handle bool\ntext handle string\nrecord handle Item\nshared_owner handle shared Item\nend\nints = arena int()\ninsert ints, 1 as hi\nbools = arena bool()\ninsert bools, true as hb\ntexts = arena string()\ninsert texts, \"x\" as hs\nrecords = arena Item()\ninsert records, Item(value = 2) as hr\nowner = share Item(value = 3)\nshared_items = arena shared Item()\ninsert shared_items, owner as hshared\nhandles = Handles(integer = hi, boolean = hb, text = hs, record = hr, shared_owner = hshared)\nprint 1\n",
              );
              assert!(rust.contains("__EvoHandle<i64>"));
              assert!(rust.contains("__EvoHandle<bool>"));
              assert!(rust.contains("__EvoHandle<&'static str>"));
              assert!(rust.contains("__EvoHandle<__EvoRecord_Item>"));
              assert!(rust.contains("__EvoHandle<std::rc::Rc<__EvoRecord_Item>>"));
              assert!(!rust.contains("unsafe"));

              let output = Command::new(binary)
                  .output()
                  .expect("generated full record-handle payload program should run");
              assert!(output.status.success());
              assert_eq!(String::from_utf8_lossy(&output.stdout), "1\n");
          }
          """)

          replace(
              "docs/LANGUAGE_SPEC_V0.md",
              """record_field_type   := storage_type_name | "handle" IDENTIFIER""",
              """record_field_type   := storage_type_name | "handle" arena_element_type""",
              "language record handle grammar",
          )
          replace(
              "docs/LANGUAGE_SPEC_V0.md",
              """- record fields may use `handle Record`; such a field is fixed-size identity and does not create recursive by-value record layout;""",
              """- record fields may use `handle T` for any supported arena payload `T`; such fields are fixed-size identity and do not create recursive by-value record layout;""",
              "language arena record field rule",
          )
          replace(
              "docs/LANGUAGE_SPEC_V0.md",
              """Supported field types are `int`, `bool`, `string`, declared record types, declared enum types when the resulting by-value nominal layout is acyclic, and `handle Record` fixed-size arena identities. A `handle Node` field inside `record Node` is not a recursive by-value `Node -> Node` edge.""",
              """Supported field types are `int`, `bool`, `string`, declared record types, declared enum types when the resulting by-value nominal layout is acyclic, and `handle T` fixed-size arena identities for the supported arena payload set. A `handle Node` field inside `record Node` is not a recursive by-value `Node -> Node` edge.""",
              "language records handle rule",
          )
          replace(
              "docs/DECISIONS.md",
              """- function parameter/return contracts may use typed handles, record fields may use `handle Record`, and sequences may store typed handles;""",
              """- function parameter/return contracts may use typed handles, record fields may use `handle T` for the full supported arena payload set, and sequences may store typed handles;""",
              "decision record handle rule",
          )
          replace(
              "docs/PROJECT_STATE.md",
              """- `handle T` works in function contracts, `handle Record` works in record fields without recursive-layout classification, and `seq handle T` supports adjacency-list-class storage;""",
              """- `handle T` works in function contracts and record fields across the supported arena payload set; `handle Node` self-edges avoid recursive-layout classification, and `seq handle T` supports adjacency-list-class storage;""",
              "project record handle rule",
          )
          PY

      - name: Format
        run: cargo fmt --all

      - name: Focused record-handle tests
        run: |
          cargo test -p evo-parser --test arena_syntax_v0
          cargo test -p evo-lowering --test arena_semantics_v0
          cargo test -p evo-codegen-rust --test arena_compile
          cargo test -p evo-codegen-rust --test arena_runtime_matrix

      - name: Workspace regression
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit validated production changes
        shell: bash
        run: |
          rm .github/workflows/dev-record-handle-payloads.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support full typed handles in record fields"
          git push origin HEAD:feature/generational-arena-v0
