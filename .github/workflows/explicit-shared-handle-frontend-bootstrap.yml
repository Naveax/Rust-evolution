name: Bootstrap explicit shared handle frontend

on:
  push:
    branches:
      - feature/explicit-shared-handle-v0
    paths:
      - '.github/workflows/explicit-shared-handle-frontend-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/explicit-shared-handle-v0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply frontend patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/evo-parser/src/lib.rs')
          text = path.read_text()

          old = '''pub enum TypeName {
              Int,
              Bool,
              String,
              Named(String),
              SharedRef(Box<TypeName>),
          }'''
          new = '''pub enum TypeName {
              Int,
              Bool,
              String,
              Named(String),
              SharedOwner(String),
              SharedRef(Box<TypeName>),
          }'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    UnaryMinus(Box<Expr>),
              SharedBorrow(Box<Expr>),
              Binary {'''
          new = '''    UnaryMinus(Box<Expr>),
              SharedBorrow(Box<Expr>),
              SharedAlloc(Box<Expr>),
              SharedDuplicate(Box<Expr>),
              Binary {'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    fn parse_record_field_type(&mut self) -> Result<RecordFieldType, ParseError> {
              let token = self.advance();'''
          new = '''    fn parse_record_field_type(&mut self) -> Result<RecordFieldType, ParseError> {
              if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared")
                  && self
                      .tokens
                      .get(self.index + 1)
                      .is_some_and(|token| matches!(token.kind, TokenKind::Identifier(_)))
              {
                  return Err(self.error_here(
                      "shared-owner record fields are not supported in v0",
                  ));
              }
              let token = self.advance();'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''                if matches!(self.current().kind, TokenKind::Ampersand) {
                      return Err(self
                          .error_here("immutable reference enum payloads are not supported in v0"));
                  }
                  Some(self.parse_owned_type_name()?)'''
          new = '''                if matches!(self.current().kind, TokenKind::Ampersand) {
                      return Err(self
                          .error_here("immutable reference enum payloads are not supported in v0"));
                  }
                  if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared")
                      && self
                          .tokens
                          .get(self.index + 1)
                          .is_some_and(|token| matches!(token.kind, TokenKind::Identifier(_)))
                  {
                      return Err(self
                          .error_here("shared-owner enum payloads are not supported in v0"));
                  }
                  Some(self.parse_owned_type_name()?)'''
          assert old in text
          text = text.replace(old, new, 1)

          pattern = re.compile(r'''    fn parse_type_name\(&mut self\) -> Result<TypeName, ParseError> \{.*?\n    \}\n\n(?=    fn parse_owned_type_name)''', re.S)
          matches = list(pattern.finditer(text))
          assert len(matches) == 1, len(matches)
          replacement = '''    fn parse_type_name(&mut self) -> Result<TypeName, ParseError> {
              if matches!(&self.current().kind, TokenKind::Identifier(name) if name == "shared") {
                  let next = self.tokens.get(self.index + 1);
                  if let Some(token) = next {
                      match &token.kind {
                          TokenKind::Identifier(name) => {
                              let name = name.clone();
                              self.advance();
                              self.advance();
                              return Ok(TypeName::SharedOwner(name));
                          }
                          TokenKind::TypeInt | TokenKind::TypeBool | TokenKind::TypeString => {
                              return Err(ParseError {
                                  message: "shared-owner types require a nominal record type in v0"
                                      .to_owned(),
                                  span: self.current().span.join(token.span),
                              });
                          }
                          _ => {}
                      }
                  }
              }

              if !matches!(self.current().kind, TokenKind::Ampersand) {
                  return self.parse_owned_type_name();
              }

              let marker = self.advance().span;
              let token = self.advance();
              match token.kind {
                  TokenKind::Identifier(name) if name == "mut" => Err(ParseError {
                      message: "mutable references are not supported in v0".to_owned(),
                      span: marker.join(token.span),
                  }),
                  TokenKind::Identifier(name) => Ok(TypeName::SharedRef(Box::new(TypeName::Named(name)))),
                  TokenKind::Ampersand => Err(ParseError {
                      message: "nested immutable reference types are not supported in v0".to_owned(),
                      span: marker.join(token.span),
                  }),
                  TokenKind::TypeInt | TokenKind::TypeBool | TokenKind::TypeString => Err(ParseError {
                      message: "immutable reference types require a nominal type in v0".to_owned(),
                      span: marker.join(token.span),
                  }),
                  _ => Err(ParseError {
                      message: "expected nominal type name after '&'".to_owned(),
                      span: marker.join(token.span),
                  }),
              }
          }

          '''
          text = pattern.sub(replacement, text, count=1)

          old = '''        if matches!(self.current().kind, TokenKind::Ampersand) {
              let start = self.advance().span;
              if matches!(self.current().kind, TokenKind::Ampersand) {
                  return Err(
                      self.error_here("nested immutable borrow expressions are not supported in v0")
                  );
              }
              let expr = self.parse_unary()?;
              let span = start.join(expr.span);
              return Ok(Expr {
                  kind: ExprKind::SharedBorrow(Box::new(expr)),
                  span,
              });
          }
          self.parse_postfix()'''
          new = '''        if matches!(self.current().kind, TokenKind::Ampersand) {
              let start = self.advance().span;
              if matches!(self.current().kind, TokenKind::Ampersand) {
                  return Err(
                      self.error_here("nested immutable borrow expressions are not supported in v0")
                  );
              }
              let expr = self.parse_unary()?;
              let span = start.join(expr.span);
              return Ok(Expr {
                  kind: ExprKind::SharedBorrow(Box::new(expr)),
                  span,
              });
          }
          let shared_operation = match &self.current().kind {
              TokenKind::Identifier(name)
                  if matches!(name.as_str(), "share" | "dup")
                      && self
                          .tokens
                          .get(self.index + 1)
                          .is_some_and(|token| matches!(token.kind, TokenKind::Identifier(_))) =>
              {
                  Some(name.clone())
              }
              _ => None,
          };
          if let Some(operation) = shared_operation {
              let start = self.advance().span;
              let expr = self.parse_unary()?;
              let span = start.join(expr.span);
              let kind = if operation == "share" {
                  ExprKind::SharedAlloc(Box::new(expr))
              } else {
                  ExprKind::SharedDuplicate(Box::new(expr))
              };
              return Ok(Expr { kind, span });
          }
          self.parse_postfix()'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          formatter = Path('crates/evo-formatter/src/lib.rs')
          text = formatter.read_text()
          old = '''    if matches!(current, TokenKind::LParen) {
          '''
          new = '''    if matches!(current, TokenKind::Identifier(_))
                  && matches!(previous, TokenKind::RParen)
              {
                  return true;
              }

              if matches!(current, TokenKind::LParen) {
          '''
          assert old in text
          text = text.replace(old, new, 1)
          formatter.write_text(text)
          PY

      - name: Format and test frontend slice
        run: |
          cargo fmt --all
          cargo test -p evo-parser
          cargo test -p evo-formatter --test shared_handle_surface

      - name: Commit frontend slice and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/explicit-shared-handle-frontend-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/evo-parser/src/lib.rs crates/evo-formatter/src/lib.rs .github/workflows/explicit-shared-handle-frontend-bootstrap.yml
          git commit -m 'feat: add explicit shared handle frontend surface'
          git push origin HEAD:feature/explicit-shared-handle-v0
