name: Bootstrap explicit shared handle frontend

on:
  push:
    branches:
      - feature/explicit-shared-handle-v0
    paths:
      - '.github/workflows/explicit-shared-handle-frontend-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feature/explicit-shared-handle-v0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply frontend patch
        run: python3 .github/scripts/bootstrap_explicit_shared_frontend.py

      - name: Format and test frontend slice
        run: |
          cargo fmt --all
          cargo test -p evo-parser --test shared_handle_surface
          cargo test -p evo-formatter --test shared_handle_surface

      - name: Commit frontend slice and remove bootstrap
        shell: bash
        run: |
          rm .github/workflows/explicit-shared-handle-frontend-bootstrap.yml
          rm .github/scripts/bootstrap_explicit_shared_frontend.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/evo-parser/src/lib.rs crates/evo-formatter/src/lib.rs .github/workflows/explicit-shared-handle-frontend-bootstrap.yml .github/scripts/bootstrap_explicit_shared_frontend.py
          git commit -m 'feat: add explicit shared handle frontend surface'
          git push origin HEAD:feature/explicit-shared-handle-v0
