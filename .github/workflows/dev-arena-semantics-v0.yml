name: Dev arena semantics v0

on:
  push:
    branches:
      - feature/generational-arena-v0
    paths:
      - '.github/workflows/dev-arena-semantics-v0.yml'

permissions:
  contents: write

concurrency:
  group: dev-arena-semantics-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/generational-arena-v0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply generational arena semantic/runtime patch
        run: |
          python3 .github/dev/arena_semantics_v0_patch.py
          cargo fmt --all

      - name: Focused semantic and generated-Rust tests
        run: |
          cargo fmt --all -- --check
          cargo test -p evo-lowering --test arena_semantics_v0
          cargo test -p evo-codegen-rust --test arena_compile
          cargo test -p evo-codegen-rust --test sequence_compile

      - name: Workspace regression
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit validated semantic/runtime changes
        run: |
          git config user.name "Naveax"
          git config user.email "Omersevik095@gmail.com"
          git add crates/evo-lowering/src/lib.rs crates/evo-lowering/src/reference_state.rs crates/evo-lowering/tests/arena_semantics_v0.rs crates/evo-codegen-rust/src/lib.rs crates/evo-codegen-rust/tests/arena_compile.rs
          git diff --cached --check
          git commit -m "feat: implement generational arena semantics v0"
          git push origin HEAD:feature/generational-arena-v0
