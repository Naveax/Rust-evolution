name: Dev arena syntax v0

on:
  push:
    branches:
      - feature/generational-arena-v0
    paths:
      - '.github/workflows/dev-arena-syntax-v0.yml'

permissions:
  contents: write

concurrency:
  group: dev-arena-syntax-v0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/generational-arena-v0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Apply syntax and type plumbing
        run: |
          python3 .github/dev/arena_syntax_v0_patch.py
          cargo fmt --all

      - name: Focused syntax and formatter tests
        run: |
          cargo fmt --all -- --check
          cargo test -p evo-parser --test arena_syntax_v0 --test sequence_syntax_v0
          cargo test -p evo-formatter --test arena_syntax_v0 --test sequence_syntax_v0

      - name: Workspace regression
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Commit validated source changes
        run: |
          git config user.name "Naveax"
          git config user.email "Omersevik095@gmail.com"
          git add crates/evo-parser/src/lib.rs crates/evo-parser/tests/sequence_syntax_v0.rs crates/evo-parser/tests/arena_syntax_v0.rs crates/evo-formatter/src/lib.rs crates/evo-formatter/tests/arena_syntax_v0.rs crates/evo-lowering/src/lib.rs crates/evo-lowering/src/record_environment_records.rs crates/evo-lowering/src/record_ir.rs crates/evo-lowering/src/record_ownership.rs crates/evo-lowering/src/borrow_inference.rs crates/evo-codegen-rust/src/lib.rs
          git diff --cached --check
          git commit -m "feat: add contextual generational arena syntax v0"
          git push origin HEAD:feature/generational-arena-v0
