name: Dev add arena reference cost control

on:
  push:
    branches:
      - research/generational-arena-surface-v0
    paths:
      - '.github/workflows/dev-add-arena-reference-cost.yml'

permissions:
  contents: write

concurrency:
  group: dev-add-arena-reference-cost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/generational-arena-surface-v0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Patch equivalent-work reference control
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          test = Path('crates/evo-lowering/tests/generational_arena_surface_research.rs')
          text = test.read_text()
          reference_block = base64.b64decode('').decode()
          marker = '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\nstruct LocalHandle {\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one LocalHandle marker, found {text.count(marker)}')
          text = text.replace(marker, reference_block + '\n' + marker)

          report_anchor = '    writeln!(json, "  \\"handle_copy_word_count\\": 3,").unwrap();\n'
          report_insert = '    writeln!(json, "  \\"reference_equivalent_work\\": true,").unwrap();\n    writeln!(json, "  \\"reference_handle_size_equal\\": true,").unwrap();\n'
          if text.count(report_anchor) != 1:
              raise SystemExit(f'expected one report anchor, found {text.count(report_anchor)}')
          text = text.replace(report_anchor, report_anchor + report_insert)

          findings_anchor = '    findings.push(finding(\n        "free-list-reuse-is-constant-time-class",\n'
          comparison = base64.b64decode('').decode()
          if text.count(findings_anchor) != 1:
              raise SystemExit(f'expected one cost findings anchor, found {text.count(findings_anchor)}')
          text = text.replace(findings_anchor, comparison + findings_anchor)
          test.write_text(text)

          workflow = Path('.github/workflows/generational-arena-surface-research.yml')
          wf = workflow.read_text()
          wf_anchor = "          assert report['handle_copy_word_count'] == 3, report\n"
          wf_insert = "          assert report['reference_equivalent_work'] is True, report\n          assert report['reference_handle_size_equal'] is True, report\n"
          if wf.count(wf_anchor) != 1:
              raise SystemExit(f'expected one workflow validation anchor, found {wf.count(wf_anchor)}')
          workflow.write_text(wf.replace(wf_anchor, wf_anchor + wf_insert))

          doc = Path('docs/GENERATIONAL_ARENA_SURFACE_RESEARCH.md')
          docs = doc.read_text()
          doc_anchor = '- no per-handle allocation or refcount operation is required.\n'
          doc_insert = '- a deterministic equivalent-work control executes the candidate and an independent idiomatic Rust generational-slot reference through the same seven insert/get/remove/reuse/stale-get operations;\n- both produce the same checksum, slot count, free-list state, operation count, and three-machine-word-class handle size.\n'
          if docs.count(doc_anchor) != 1:
              raise SystemExit(f'expected one docs cost anchor, found {docs.count(doc_anchor)}')
          doc.write_text(docs.replace(doc_anchor, doc_anchor + doc_insert))
          PY
          cargo fmt --all

      - name: Validate research and workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy -p evo-lowering --test generational_arena_surface_research -- -D warnings
          EVO_REQUIRE_PINNED_RUSTC=1 EVO_GIT_SHA=${GITHUB_SHA} EVO_GENERATIONAL_ARENA_SURFACE_RESEARCH_OUT=${RUNNER_TEMP}/arena-research cargo test -p evo-lowering --test generational_arena_surface_research generational_arena_surface_research_resolves_reuse_identity_and_borrow_boundaries -- --ignored --exact --nocapture
          cargo test -p evo-lowering --test sequence_v0

      - name: Remove one-shot workflow
        run: rm .github/workflows/dev-add-arena-reference-cost.yml

      - name: Commit validated research control
        run: |
          git config user.name "Naveax"
          git config user.email "Omersevik095@gmail.com"
          git add crates/evo-lowering/tests/generational_arena_surface_research.rs .github/workflows/generational-arena-surface-research.yml docs/GENERATIONAL_ARENA_SURFACE_RESEARCH.md .github/workflows/dev-add-arena-reference-cost.yml
          git diff --cached --check
          git commit -m "research: add arena reference cost control"
          git push origin HEAD:research/generational-arena-surface-v0
