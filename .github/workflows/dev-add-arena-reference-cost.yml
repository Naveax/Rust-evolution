name: Dev add arena reference cost control

on:
  push:
    branches:
      - research/generational-arena-surface-v0
    paths:
      - '.github/workflows/dev-add-arena-reference-cost.yml'

permissions:
  contents: write

concurrency:
  group: dev-add-arena-reference-cost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/generational-arena-surface-v0
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Patch equivalent-work reference control
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('crates/evo-lowering/tests/generational_arena_surface_research.rs')
          text = test.read_text()

          anchor = '''impl<T> Arena<T> {
'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one Arena impl anchor, found {text.count(anchor)}')

          after_arena = '''
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
struct ReferenceHandle {
    arena: u64,
    index: usize,
    generation: u64,
}

#[derive(Debug)]
struct ReferenceSlot<T> {
    generation: u64,
    value: Option<T>,
    retired: bool,
}

#[derive(Debug)]
struct ReferenceArena<T> {
    id: u64,
    slots: Vec<ReferenceSlot<T>>,
    free: Vec<usize>,
}

impl<T> ReferenceArena<T> {
    fn with_id(id: u64) -> Self {
        Self {
            id,
            slots: Vec::new(),
            free: Vec::new(),
        }
    }

    fn insert(&mut self, value: T) -> ReferenceHandle {
        let (index, generation) = if let Some(index) = self.free.pop() {
            let slot = &mut self.slots[index];
            assert!(!slot.retired);
            assert!(slot.value.is_none());
            slot.value = Some(value);
            (index, slot.generation)
        } else {
            let index = self.slots.len();
            self.slots.push(ReferenceSlot {
                generation: 0,
                value: Some(value),
                retired: false,
            });
            (index, 0)
        };
        ReferenceHandle {
            arena: self.id,
            index,
            generation,
        }
    }

    fn get(&self, handle: ReferenceHandle) -> Option<&T> {
        (handle.arena == self.id)
            .then_some(())
            .and_then(|()| self.slots.get(handle.index))
            .filter(|slot| !slot.retired && slot.generation == handle.generation)
            .and_then(|slot| slot.value.as_ref())
    }

    fn remove(&mut self, handle: ReferenceHandle) -> Option<T> {
        if handle.arena != self.id {
            return None;
        }
        let slot = self.slots.get_mut(handle.index)?;
        if slot.retired || slot.generation != handle.generation {
            return None;
        }
        let value = slot.value.take()?;
        if let Some(next) = slot.generation.checked_add(1) {
            slot.generation = next;
            self.free.push(handle.index);
        } else {
            slot.retired = true;
        }
        Some(value)
    }
}

#[derive(Debug, Clone, Copy, PartialEq, Eq)]
struct CostSnapshot {
    checksum: i64,
    slots: usize,
    free: usize,
    operations: usize,
}

fn candidate_cost_snapshot() -> CostSnapshot {
    let mut arena = Arena::with_id(77);
    let first = arena.insert(10_i64);
    let stale = arena.insert(20_i64);
    let mut checksum = *arena.get(first).expect("candidate first");
    let removed = arena.remove(stale).expect("candidate remove");
    let fresh = arena.insert(30_i64);
    assert_eq!(fresh.index, stale.index);
    assert!(arena.get(stale).is_none());
    checksum += removed + *arena.get(fresh).expect("candidate fresh");
    CostSnapshot {
        checksum,
        slots: arena.slots.len(),
        free: arena.free.len(),
        operations: 7,
    }
}

fn reference_cost_snapshot() -> CostSnapshot {
    let mut arena = ReferenceArena::with_id(77);
    let first = arena.insert(10_i64);
    let stale = arena.insert(20_i64);
    let mut checksum = *arena.get(first).expect("reference first");
    let removed = arena.remove(stale).expect("reference remove");
    let fresh = arena.insert(30_i64);
    assert_eq!(fresh.index, stale.index);
    assert!(arena.get(stale).is_none());
    checksum += removed + *arena.get(fresh).expect("reference fresh");
    CostSnapshot {
        checksum,
        slots: arena.slots.len(),
        free: arena.free.len(),
        operations: 7,
    }
}
'''

          marker = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
struct LocalHandle {
'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one LocalHandle marker, found {text.count(marker)}')
          text = text.replace(marker, after_arena + '\n' + marker)

          report_anchor = '''    writeln!(json, "  \\"handle_copy_word_count\\": 3,").unwrap();
'''
          report_insert = '''    writeln!(json, "  \\"reference_equivalent_work\\": true,").unwrap();
    writeln!(json, "  \\"reference_handle_size_equal\\": true,").unwrap();
'''
          if text.count(report_anchor) != 1:
              raise SystemExit(f'expected one report anchor, found {text.count(report_anchor)}')
          text = text.replace(report_anchor, report_anchor + report_insert)

          findings_anchor = '''    findings.push(finding(
        "free-list-reuse-is-constant-time-class",
'''
          comparison = '''    let candidate_cost = candidate_cost_snapshot();
    let reference_cost = reference_cost_snapshot();
    findings.push(finding(
        "idiomatic-reference-equivalent-work-matches",
        Class::CostEvidence,
        candidate_cost == reference_cost,
        "candidate and direct idiomatic Rust generational-slot reference perform the same seven logical operations and end with the same checksum/storage/free-list state",
    ));
    findings.push(finding(
        "idiomatic-reference-handle-size-matches",
        Class::CostEvidence,
        size_of::<Handle>() == size_of::<ReferenceHandle>(),
        "candidate and idiomatic reference handles both occupy the same three-machine-word-class identity shape",
    ));

'''
          if text.count(findings_anchor) != 1:
              raise SystemExit(f'expected one cost findings anchor, found {text.count(findings_anchor)}')
          text = text.replace(findings_anchor, comparison + findings_anchor)
          test.write_text(text)

          workflow = Path('.github/workflows/generational-arena-surface-research.yml')
          wf = workflow.read_text()
          wf_anchor = '''          assert report['handle_copy_word_count'] == 3, report
'''
          wf_insert = '''          assert report['reference_equivalent_work'] is True, report
          assert report['reference_handle_size_equal'] is True, report
'''
          if wf.count(wf_anchor) != 1:
              raise SystemExit(f'expected one workflow validation anchor, found {wf.count(wf_anchor)}')
          workflow.write_text(wf.replace(wf_anchor, wf_anchor + wf_insert))

          doc = Path('docs/GENERATIONAL_ARENA_SURFACE_RESEARCH.md')
          docs = doc.read_text()
          doc_anchor = '''- no per-handle allocation or refcount operation is required.
'''
          doc_insert = '''- a deterministic equivalent-work control executes the candidate and an independent idiomatic Rust generational-slot reference through the same seven insert/get/remove/reuse/stale-get operations;
- both produce the same checksum, slot count, free-list state, operation count, and three-machine-word-class handle size.
'''
          if docs.count(doc_anchor) != 1:
              raise SystemExit(f'expected one docs cost anchor, found {docs.count(doc_anchor)}')
          doc.write_text(docs.replace(doc_anchor, doc_anchor + doc_insert))
          PY
          cargo fmt --all

      - name: Validate research and workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy -p evo-lowering --test generational_arena_surface_research -- -D warnings
          EVO_REQUIRE_PINNED_RUSTC=1 EVO_GIT_SHA=${GITHUB_SHA} EVO_GENERATIONAL_ARENA_SURFACE_RESEARCH_OUT=${RUNNER_TEMP}/arena-research cargo test -p evo-lowering --test generational_arena_surface_research generational_arena_surface_research_resolves_reuse_identity_and_borrow_boundaries -- --ignored --exact --nocapture
          cargo test -p evo-lowering --test sequence_v0

      - name: Remove one-shot workflow
        run: rm .github/workflows/dev-add-arena-reference-cost.yml

      - name: Commit validated research control
        run: |
          git config user.name "Naveax"
          git config user.email "Omersevik095@gmail.com"
          git add crates/evo-lowering/tests/generational_arena_surface_research.rs .github/workflows/generational-arena-surface-research.yml docs/GENERATIONAL_ARENA_SURFACE_RESEARCH.md .github/workflows/dev-add-arena-reference-cost.yml
          git diff --cached --check
          git commit -m "research: add arena reference cost control"
          git push origin HEAD:research/generational-arena-surface-v0
