name: Bootstrap shared ownership rustfmt

on:
  push:
    branches:
      - research/shared-ownership-ergonomics-v0
    paths:
      - '.github/workflows/shared-ownership-format-bootstrap.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/shared-ownership-ergonomics-v0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/evo-lowering/tests/shared_ownership_research.rs
          git commit -m 'style: format shared ownership research harness'
          git push origin HEAD:research/shared-ownership-ergonomics-v0
