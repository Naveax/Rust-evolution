name: DEV immutable reference bootstrap v4

on:
  push:
    branches:
      - feature/immutable-reference-surface-v0
    paths:
      - .github/workflows/dev-reference-bootstrap-v4.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/immutable-reference-surface-v0
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Reuse v2 patch and cover historical research consumer
        shell: python
        run: |
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/dev-reference-bootstrap-v2.yml").read_text().splitlines()
          marker = workflow.index("      - name: Apply bounded frontend surface")
          run_line = next(i for i in range(marker + 1, len(workflow)) if workflow[i] == "        run: |")
          end = next(i for i in range(run_line + 1, len(workflow)) if workflow[i] == "      - name: Format")
          prefix = "          "
          code = "\n".join(
              line[len(prefix):] if line.startswith(prefix) else line
              for line in workflow[run_line + 1:end]
          )
          exec(compile(code, "dev-reference-bootstrap-v2", "exec"), {})

          path = Path("crates/evo-lowering/tests/borrow_inference_research.rs")
          text = path.read_text()
          pattern = re.compile(
              r"(?P<indent>\s*)ExprKind::LogicalNot\(inner\) \| ExprKind::UnaryMinus\(inner\) => \{\n"
              r"(?P<body>\s*collect_expr_effects\(inner, parameter, UseMode::Consume, effects\);\n)"
              r"(?P=indent)\}",
          )
          replacement = (
              r"\g<indent>ExprKind::LogicalNot(inner)\n"
              r"\g<indent>| ExprKind::UnaryMinus(inner)\n"
              r"\g<indent>| ExprKind::SharedBorrow(inner) => {\n"
              r"\g<body>\g<indent>}"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"borrow_inference_research: expected one unary effect match, found {count}")
          path.write_text(text)

      - name: Format
        run: cargo +1.98.0 fmt --all

      - name: Clippy
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo +1.98.0 test --workspace

      - name: Commit verified frontend slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/evo-parser/src/lib.rs crates/evo-lowering/src/ crates/evo-lowering/tests/borrow_inference_research.rs
          git diff --cached --check
          git commit -m "feat: parse immutable reference surface"
          git push origin HEAD:feature/immutable-reference-surface-v0
