name: Dev interior expectation fix

on:
  push:
    paths:
      - '.github/workflows/dev-interior-expectation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/interior-mutability-v0

      - name: Patch stable RefCell panic evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/evo-lowering/tests/interior_mutability_research.rs')
          s = p.read_text()
          s = s.replace('expected_stderr_contains: Some("BorrowMutError")', 'expected_stderr_contains: Some("already borrowed")')
          s = s.replace('expected_stderr_contains: Some("BorrowError")', 'expected_stderr_contains: Some("already mutably borrowed")')
          old = 'assert!(findings.iter().all(|finding| finding.expectation_matched));'
          new = '''let mismatches: Vec<_> = findings\n        .iter()\n        .filter(|finding| !finding.expectation_matched)\n        .map(|finding| (finding.spec.name, finding.rust_ran_successfully, finding.stdout.as_str(), finding.stderr_summary.as_str()))\n        .collect();\n    assert!(mismatches.is_empty(), "research expectation mismatches: {mismatches:?}");'''
          if old not in s:
              raise SystemExit('aggregate assertion pattern missing')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Format
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo fmt --all
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/evo-lowering/tests/interior_mutability_research.rs
          git commit -m "test: stabilize interior borrow conflict evidence"
          git push origin HEAD:research/interior-mutability-v0
