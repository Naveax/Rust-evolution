name: Tighten explicit shared owner spec bounds

on:
  push:
    branches:
      - feature/explicit-shared-handle-v0-docs
    paths:
      - '.github/workflows/stage-explicit-shared-owner-spec-bounds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v5
        with:
          ref: feature/explicit-shared-handle-v0-docs

      - name: Tighten grammar and enum boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/LANGUAGE_SPEC_V0.md')
          text = path.read_text()
          old = '''unary               := "-" unary | "&" unary | contextual_shared_prefix | postfix
          contextual_shared_prefix
                              := "share" unary | "dup" unary
          postfix             := primary ("." IDENTIFIER)*
          '''
          new = '''unary               := "-" unary | "&" unary | contextual_shared_prefix | postfix
          contextual_shared_prefix
                              := ("share" | "dup") identifier_led_unary
          identifier_led_unary
                              := unary   # accepted only when the operand begins with IDENTIFIER
          postfix             := primary ("." IDENTIFIER)*
          '''
          if old not in text:
              raise SystemExit('expected contextual shared grammar block not found')
          text = text.replace(old, new, 1)

          marker = '''The three source words stay contextual rather than becoming lexer keywords:\n\n'''
          insert = '''The three source words stay contextual rather than becoming lexer keywords:\n\nThe contextual prefix recognizer is intentionally narrower than a general unary operator: after `share` or `dup`, the operand must begin with an identifier token. This covers the production forms used by the slice, including locals and identifier-led calls/constructors, while grouped, literal, or operator-leading operands are not captured as shared-owner prefixes.\n\n'''
          if marker not in text:
              raise SystemExit('shared-owner marker not found')
          text = text.replace(marker, insert, 1)

          marker2 = '''Shared-owner record fields and enum payloads, nested/general `shared` type algebra, `Weak`, cycle solving, cross-thread ownership, interior mutability, synchronization, mutable references, and generalized lifetime/generic machinery remain outside this slice.\n'''
          insert2 = marker2 + '''\nShared-owner v0 is currently a record-only executable path. A program containing enum declarations uses the Enums v0 integrated semantic pipeline, which currently rejects explicit shared-owner/reference contracts and expressions before executable IR/codegen. Shared ownership therefore does not yet compose with enum-bearing programs; this is an explicit fail-closed boundary rather than an implicit conversion or runtime fallback.\n'''
          if marker2 not in text:
              raise SystemExit('shared-owner non-goal marker not found')
          text = text.replace(marker2, insert2, 1)
          path.write_text(text)
          PY

      - name: Validate bounded wording
        run: |
          grep -q 'identifier_led_unary' docs/LANGUAGE_SPEC_V0.md
          grep -q 'operand must begin with an identifier token' docs/LANGUAGE_SPEC_V0.md
          grep -q 'does not yet compose with enum-bearing programs' docs/LANGUAGE_SPEC_V0.md

      - name: Commit spec and remove bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LANGUAGE_SPEC_V0.md
          git rm .github/workflows/stage-explicit-shared-owner-spec-bounds.yml
          git commit -m 'docs: tighten explicit shared owner v0 bounds'
          git push origin HEAD:feature/explicit-shared-handle-v0-docs
